<title>Configuración del restaurante · Japp</title>

:root[data-theme="dark"]{--bg:#0f1719;--card:#162226;--ink:#e3ecee;--muted:#93a4a8;--line:#29393d;--soft:#1c2b30;--accent:#5fb3c0;--accent-ink:#0f1719;--danger:#ec6f68;--warn:#e0a54a;--warnbg:#3a2c14;--ok:#6cc27a;--okbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;flex:1 1 auto}
.top .st{font-size:13px;color:var(--muted)}
.btn{font:inherit;font-weight:600;border-radius:999px;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);padding:8px 16px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.del{border-color:var(--danger);color:var(--danger)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav.side{display:none}}
nav.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav.side a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:8px;font-size:14px}
nav.side a:hover{background:var(--soft);color:var(--ink)}
nav.side a .n{display:inline-block;min-width:18px;font-weight:700;color:var(--accent)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px;scroll-margin-top:80px}
section.card>h2{font-size:18px;margin:0 0 4px}
section.card>p.hint{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f>span{font-size:13px;font-weight:600}
.f>span i{font-style:normal;color:var(--danger)}
.f>small{color:var(--muted);font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;background:var(--card);cursor:pointer}
.chips label:has(input:checked){border-color:var(--accent);color:var(--accent)}
.chips input{width:16px;height:16px}
.f.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;font-weight:600;padding-top:22px}
.sec-in{display:flex;gap:6px}
.sec-in input{flex:1}
.item{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--soft)}
.item-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.item-hd b{flex:1;font-size:15px}
.img-row{display:flex;align-items:center;gap:10px}
.img-row img{width:56px;height:56px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line)}
.img-row img.w{width:120px}
.banner{border-radius:12px;padding:10px 14px;font-size:13.5px;margin:0 0 14px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.ok{background:var(--okbg);color:var(--ok)}
.err{color:var(--danger);font-size:12.5px;min-height:0}
input[aria-invalid="true"]{border-color:var(--danger)}
footer{max-width:1100px;margin:0 auto;padding:8px 16px 40px;color:var(--muted);font-size:12.5px}
pre.json{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:10px;padding:12px;font-size:12px;max-height:360px;overflow:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<header class="top"><div class="top-in">
  <h1>Configuración del restaurante · Japp</h1>
  <span class="st" id="saved" role="status">Sin cambios</span>
  <label class="btn sm" for="imp">Importar JSON</label><input type="file" id="imp" accept="application/json,.json" class="sr">
  <button type="button" class="btn sm" id="copy">Copiar JSON</button>
  <button type="button" class="btn primary" id="exp">Descargar JSON</button>
</div></header>

<div class="layout">
  <nav class="side" id="nav" aria-label="Secciones"></nav>
  <main id="main"></main>
</div>
<footer>Se guarda solo en este navegador mientras escribes. Al terminar, pulsa «Descargar JSON» y pásame el archivo. Las claves y contraseñas van en el JSON: compártelo solo por un canal seguro. Cambia todos los PIN antes de producción.</footer>

  if (b.dataset.del) { const [s, j] = b.dataset.del.split(":"); D[s].splice(+j, 1); save(); render(); return; }
  if (b.dataset.dup) { const [s, j] = b.dataset.dup.split(":"); D[s].splice(+j + 1, 0, JSON.parse(JSON.stringify(D[s][+j]))); save(); render(); return; }
  if (b.dataset.pg) { const [id, gi, on] = b.dataset.pg.split(":"); let last = null;
    document.querySelectorAll(`input[data-t=perms][data-g="${gi}"]`).forEach(x => { if (x.id.startsWith(id + "_")) { x.checked = on === "1"; last = x; } }); if (last) { set(last); render(); } return; }
  if (b.dataset.eye) { const i = document.getElementById(b.dataset.eye); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "Ver" : "Ocultar"; }
});
function alertBox(m) { $("#saved").textContent = m; }
$("#exp").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(payload(), null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "japp-configuracion-" + ((D.restaurante && D.restaurante.codigo) || "restaurante").toLowerCase() + ".json"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); $("#saved").textContent = "JSON descargado";
});
$("#copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(payload(), null, 2)); $("#saved").textContent = "JSON copiado"; }
  catch (e) { $("#saved").textContent = "No se pudo copiar: usa «Descargar JSON»"; }
});
$("#imp").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const j = JSON.parse(r.result); if (!j || typeof j !== "object") throw 0; toOne(j); delete j.formato; delete j.version; delete j.generado;
      S.forEach(s => { if (j[s.id] !== undefined) D[s.id] = j[s.id]; }); save(); render(); $("#saved").textContent = "JSON importado"; }
    catch (err) { $("#saved").textContent = "Ese archivo no es un JSON de configuración válido"; } e.target.value = ""; };
  r.readAsText(f);
});
render();
</script>
