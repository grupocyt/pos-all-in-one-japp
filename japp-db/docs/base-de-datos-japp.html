no. Vacío (NULL) = el logo de la cadena, como hasta ahora.\nALTER TABLE \"store_parameters\" ADD COLUMN IF NOT EXISTS \"ticket_logo\" TEXT;\nCOMMENT ON COLUMN \"store_parameters\".\"ticket_logo\" IS 'Logo del ticket ya preparado para la impresora (GS v 0 en base64); NULL = logo de la cadena';\n\n\n-- 0032 · Pruebas en JC01 del 04/11/2026 (tarde), decidido con el dueño el 05/11 (API 1.2.268).\n\n-- 2 · Varias notas por mesa, cada una con quién la dejó, desde qué equipo y cuándo. No se borran ni se cambian.\n-- «note» se queda con todas juntas («alérgico · trona»), para comandas, precuentas y equipos antiguos.\nALTER TABLE \"orders\" ADD COLUMN IF NOT EXISTS \"notes\" JSONB NOT NULL DEFAULT '[]'::jsonb;\nCOMMENT ON COLUMN \"orders\".\"notes\" IS 'Notas de la mesa: [{id, text, user, role, device, at}] (no se borran; note = todas juntas)';\nUPDATE \"orders\" SET \"notes\" = jsonb_build_array(jsonb_build_object(\n    'id', gen_random_uuid()::text, 'text', \"note\", 'user', coalesce(\"opened_by_user_name\", ''),\n    'role', coalesce(\"opened_by_role\", ''), 'device', coalesce(\"opened_by_device\", ''),\n    'at', to_char(\"opened_by_at\" AT TIME ZONE 'UTC', 'YYYY-MM-DD\"T\"HH24:MI:SS.MS\"Z\"')))\n WHERE coalesce(trim(\"note\"), '') <> '' AND \"notes\" = '[]'::jsonb;\n\n-- 1 · Historial › pestaña Developer: un permiso propio. Por defecto, solo el perfil Administrador (Sistemas).\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\") VALUES\n  ('pedido.historialDev', 'Pedido', 'Historial › Developer', 18)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT p.\"id\", 'pedido.historialDev', p.\"store_id\" FROM \"user_profile\" p WHERE p.\"code\" = 'ADMIN'\nON CONFLICT DO NOTHING;\n\n-- 11 · Gestiones: un permiso por botón. Los que iban juntos se separan: Resumen semana y Eliminaciones (antes «Informes»),\n-- Mesas en servicio (antes «KPI») y Enviar ventas al SIR (antes «Cerrar periodo»).\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\") VALUES\n  ('funciones.semana', 'Funciones', 'Resumen semana', 29),\n  ('funciones.eliminaciones', 'Funciones', 'Eliminaciones', 30),\n  ('funciones.servicio', 'Funciones', 'Mesas en servicio', 31),\n  ('funciones.sir', 'Funciones', 'Enviar ventas al SIR', 32)\nON CONFLICT (\"code\") DO NOTHING;\n-- los perfiles que no están en la tabla del dueño (p. ej. Capitán) siguen viendo lo mismo que antes\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT pp.\"profile_id\", v.\"code\", pp.\"store_id\"\n    FROM \"profile_permission\" pp\n    JOIN (VALUES ('funciones.informes', 'funciones.semana'), ('funciones.informes', 'funciones.eliminaciones'),\n                 ('funciones.kpi', 'funciones.servicio'), ('funciones.periodo', 'funciones.sir')) AS v(\"old\", \"code\")\n      ON v.\"old\" = pp.\"permission_code\"\nON CONFLICT DO NOTHING;\n-- Reparto por rol decidido el 05/11 (Administrador, Encargado = Administrador local, Cajero y Mesero/Barra):\n-- Administrador todo; Encargado todo menos el SIR; Cajero Facturas, Mesas en servicio, Abrir cajón, Arqueo y Cerrar periodo;\n-- Mesero nada. Se puede cambiar perfil a perfil en Ajustes › Perfiles.\nDELETE FROM \"profile_permission\" pp\n USING \"user_profile\" p\n WHERE p.\"id\" = pp.\"profile_id\" AND p.\"code\" IN ('ADMIN', 'ADMIN_LOCAL', 'CAJERO', 'MESERO')\n   AND pp.\"permission_code\" IN ('funciones.facturas', 'pedido.reconexiones', 'funciones.semana', 'funciones.eliminaciones',\n     'funciones.kpi', 'funciones.servicio', 'funciones.sir', 'funciones.abrirCajon', 'mesas.moverMesas', 'funciones.caja',\n     'funciones.periodo');\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT p.\"id\", v.\"code\", p.\"store_id\"\n    FROM (VALUES\n      ('ADMIN', 'funciones.facturas'), ('ADMIN', 'pedido.reconexiones'), ('ADMIN', 'funciones.semana'),\n      ('ADMIN', 'funciones.eliminaciones'), ('ADMIN', 'funciones.kpi'), ('ADMIN', 'funciones.servicio'), ('ADMIN', 'funciones.sir'),\n      ('ADMIN', 'funciones.abrirCajon'), ('ADMIN', 'mesas.moverMesas'), ('ADMIN', 'funciones.caja'), ('ADMIN', 'funciones.periodo'),\n      ('ADMIN_LOCAL', 'funciones.facturas'), ('ADMIN_LOCAL', 'pedido.reconexiones'), ('ADMIN_LOCAL', 'funciones.semana'),\n      ('ADMIN_LOCAL', 'funciones.eliminaciones'), ('ADMIN_LOCAL', 'funciones.kpi'), ('ADMIN_LOCAL', 'funciones.servicio'),\n      ('ADMIN_LOCAL', 'funciones.abrirCajon'), ('ADMIN_LOCAL', 'mesas.moverMesas'), ('ADMIN_LOCAL', 'funciones.caja'),\n      ('ADMIN_LOCAL', 'funciones.periodo'),\n      ('CAJERO', 'funciones.facturas'), ('CAJERO', 'funciones.servicio'), ('CAJERO', 'funciones.abrirCajon'),\n      ('CAJERO', 'funciones.caja'), ('CAJERO', 'funciones.periodo')\n    ) AS v(\"profile\", \"code\")\n    JOIN \"user_profile\" p ON p.\"code\" = v.\"profile\"\n    JOIN \"permission\" x ON x.\"code\" = v.\"code\"\nON CONFLICT DO NOTHING;\n\n-- 9, 10 · Corte X, corte Z y comanda de anulación configurables en Ajustes › Formatos: van en el mismo\n-- store_parameters.ticket_formats (0029) como {cutx:{…}, cutz:{…}, void:{…}}. Lo que no viene, sale (no hace falta columna).\nCOMMENT ON COLUMN \"store_parameters\".\"ticket_formats\" IS 'Formatos de Ajustes › Formatos de ticket: {prebill, invoice, cutx, cutz, void}; lo que falta, sale';\n\n\n-- 0033 · Pruebas de la 1.2.268 en JC01 (documento «POS PRUEBAS V. 1.2.268»), aprobado por el dueño el 11/11/2026 (API 1.2.269).\n\n-- A3 · Descuentos por perfil (Ajustes › Facturación › Descuentos): qué perfiles lo pueden aplicar, para todos los equipos a la vez.\n-- [] = todos. Lo de antes: «Solo encargados» (needs_authorization) pasa a Administrador y Administrador local.\nALTER TABLE \"discount\" ADD COLUMN IF NOT EXISTS \"profiles\" JSONB NOT NULL DEFAULT '[]'::jsonb;\nCOMMENT ON COLUMN \"discount\".\"profiles\" IS 'Códigos de perfil que pueden aplicar el descuento ([\"ADMIN\",\"CAJERO\"]); [] = todos';\nUPDATE \"discount\" SET \"profiles\" = '[\"ADMIN\",\"ADMIN_LOCAL\"]'::jsonb\n WHERE \"needs_authorization\" = TRUE AND \"profiles\" = '[]'::jsonb;\n\n-- A4 · Fast food: nombre del cliente (solo el nombre, para llamarle; no son datos fiscales)\nALTER TABLE \"orders\" ADD COLUMN IF NOT EXISTS \"customer_name\" VARCHAR(40);\nCOMMENT ON COLUMN \"orders\".\"customer_name\" IS 'Nombre del cliente en fast food (sale en la comanda y en el ticket); no es un dato fiscal';\n\n-- A5 · Calificativos por categoría: los PLU de la categoría CALIFICATIVOS que salen en Comentario para sus productos. [] = todos.\nALTER TABLE \"category\" ADD COLUMN IF NOT EXISTS \"qualifiers\" JSONB NOT NULL DEFAULT '[]'::jsonb;\nCOMMENT ON COLUMN \"category\".\"qualifiers\" IS 'PLU de los calificativos que salen al comentar un producto de esta categoría; [] = todos';\n\n-- A7 · Mesa cerrada a base de eliminar lo enviado (no se cobra nada): motivo obligatorio, para Gestiones › Eliminaciones › Mesas enteras\nALTER TABLE \"orders\" ADD COLUMN IF NOT EXISTS \"void_close\" JSONB;\nCOMMENT ON COLUMN \"orders\".\"void_close\" IS 'Cierre de la mesa entera con eliminaciones: {reason, amount, lines, user, role, device, at}';\n\n-- A10 · Resumen semana: las observaciones de días anteriores solo con este permiso (o la clave de quien lo tenga)\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\") VALUES\n  ('funciones.semanaEditar', 'Funciones', 'Resumen semana › editar días anteriores', 33)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT p.\"id\", 'funciones.semanaEditar', p.\"store_id\" FROM \"user_profile\" p WHERE p.\"code\" IN ('ADMIN', 'ADMIN_LOCAL')\nON CONFLICT DO NOTHING;\n\n-- D2 · Arqueo: varios datáfonos (cuántos tiene el local) y lo que marcó cada uno, en el arqueo y en el cierre\nALTER TABLE \"store_parameters\" ADD COLUMN IF NOT EXISTS \"card_terminals\" SMALLINT NOT NULL DEFAULT 1;\nALTER TABLE \"store_parameters\" DROP CONSTRAINT IF EXISTS \"ck_store_parameters_card_terminals\";\nALTER TABLE \"store_parameters\" ADD CONSTRAINT \"ck_store_parameters_card_terminals\" CHECK (\"card_terminals\" BETWEEN 1 AND 9);\nCOMMENT ON COLUMN \"store_parameters\".\"card_terminals\" IS 'Datáfonos del local: un campo por datáfono en el arqueo y el cierre';\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"card_detail\" JSONB;\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"counted_card\" NUMERIC(10,2);\nCOMMENT ON COLUMN \"cash_movement\".\"card_detail\" IS 'Arqueo: total de cada datáfono [{name, amount}]';\nALTER TABLE \"cash_closing\" ADD COLUMN IF NOT EXISTS \"card_detail\" JSONB;\nCOMMENT ON COLUMN \"cash_closing\".\"card_detail\" IS 'Cierre: total de cada datáfono [{name, amount}]';\n\n-- D2 · El corte X normal solo lleva ventas, formas de pago y propinas (el resumen completo es el del arqueo).\n-- Se quitan las partes del corte X guardadas (lo que no viene, sale) y se apagan: comensales, ticket medio, IVA, áreas,\n-- camareros, descuentos, eliminaciones, abonos y caja. Se vuelven a encender en Ajustes › Formatos › Corte X.\nUPDATE \"store_parameters\"\n   SET \"ticket_formats\" = jsonb_set(coalesce(\"ticket_formats\", '{}'::jsonb), '{cutx}',\n       (coalesce(\"ticket_formats\"->'cutx', '{}'::jsonb) - 'comensales' - 'ticketMedio' - 'iva' - 'areas' - 'camareros'\n          - 'descuentos' - 'eliminaciones' - 'abonos' - 'caja')\n       || '{\"comensales\":false,\"ticketMedio\":false,\"iva\":false,\"areas\":false,\"camareros\":false,\"descuentos\":false,\"eliminaciones\":false,\"abonos\":false,\"caja\":false}'::jsonb);\n\n\n-- 0034 · Tamaño de pantalla por equipo (11/11/2026, API 1.2.269): hay TPV muy anchos y otros más altos.\n-- Ajustes › Equipos (solo Administrador y Encargado): automático (toda la pantalla) o fijo (ancho × alto en píxeles) y la escala.\nALTER TABLE \"station\" ADD COLUMN IF NOT EXISTS \"screen_mode\" VARCHAR(10) NOT NULL DEFAULT 'auto';\nALTER TABLE \"station\" ADD COLUMN IF NOT EXISTS \"screen_width\" SMALLINT;\nALTER TABLE \"station\" ADD COLUMN IF NOT EXISTS \"screen_height\" SMALLINT;\nALTER TABLE \"station\" ADD COLUMN IF NOT EXISTS \"ui_scale\" SMALLINT NOT NULL DEFAULT 100;\nALTER TABLE \"station\" DROP CONSTRAINT IF EXISTS \"ck_station_screen\";\nALTER TABLE \"station\" ADD CONSTRAINT \"ck_station_screen\" CHECK (\n  \"screen_mode\" IN ('auto', 'fixed')\n  AND (\"screen_width\" IS NULL OR \"screen_width\" BETWEEN 800 AND 7680)\n  AND (\"screen_height\" IS NULL OR \"screen_height\" BETWEEN 600 AND 4320)\n  AND \"ui_scale\" BETWEEN 70 AND 150);\nCOMMENT ON COLUMN \"station\".\"screen_mode\" IS 'auto = toda la pantalla; fixed = screen_width × screen_height píxeles';\nCOMMENT ON COLUMN \"station\".\"ui_scale\" IS 'Escala del TPV en %, de 70 a 150 (botones, letras y ventanas)';\n\n\n-- 0035 · Carta del Manager, canales y cola de impresión (16/11/2026, API 1.2.270)\n--\n-- 1) Publicación de Carta (JSON «Campos del JSON · Publicación de Carta al TPV»): descripción y traducciones,\n--    texto del botón propio, calificativos, preguntas obligatorias / única o múltiple, y cada carga recibida\n--    en catalog_release con su publicación, tipo, menú y línea de precios.\n-- 2) Canales: solo los dos del Manager, COMIDA y BEBIDA (code). Los demás canales de comanda (hechos a mano y copias)\n--    se borran con sus impresoras por equipo y sus productos. Los canales de ticket (precuenta y factura por área) no se tocan.\n-- 3) Cola de impresión (print_job): guardar y enviar ya no esperan a la impresora.\n-- 4) Order on Table encendido o apagado (store.oot_enabled).\n\n-- Order on Table encendido o apagado (Ajustes › Restaurante). Apagado: sin botón en la mesa, sin QR y la API no da carta ni pedidos\nALTER TABLE \"store\" ADD COLUMN IF NOT EXISTS \"oot_enabled\" BOOLEAN NOT NULL DEFAULT TRUE;\nCOMMENT ON COLUMN \"store\".\"oot_enabled\" IS 'Order on Table encendido (por defecto) o apagado';\n\n-- ───────────────────────── 1. Carta ─────────────────────────\nALTER TABLE \"category\" ADD COLUMN IF NOT EXISTS \"description\" VARCHAR(300);\nALTER TABLE \"category\" ADD COLUMN IF NOT EXISTS \"translations\" JSONB NOT NULL DEFAULT '{}'::jsonb;\nCOMMENT ON COLUMN \"category\".\"description\" IS 'Descripción (Carta)';\nCOMMENT ON COLUMN \"category\".\"translations\" IS 'Textos por idioma: {\"en\":{\"name\":\"…\"}} (Order on Table)';\n\nALTER TABLE \"product\" ADD COLUMN IF NOT EXISTS \"button_label\" VARCHAR(80);\nALTER TABLE \"product\" ADD COLUMN IF NOT EXISTS \"translations\" JSONB NOT NULL DEFAULT '{}'::jsonb;\nALTER TABLE \"product\" ADD COLUMN IF NOT EXISTS \"qualifier\" BOOLEAN NOT NULL DEFAULT FALSE;\nCOMMENT ON COLUMN \"product\".\"button_label\" IS 'Texto del botón; null = el nombre del PLU. Una tecla sin texto propio usa este';\nCOMMENT ON COLUMN \"product\".\"translations\" IS 'Textos por idioma: name, ticketName, buttonLabel, description';\nCOMMENT ON COLUMN \"product\".\"qualifier\" IS 'Calificativo: texto rápido del comentario (SIN SAL, POCO HECHO…)';\n-- el texto propio que ya tenía la tecla de su categoría pasa al producto\nUPDATE \"product\" p SET \"button_label\" = btrim(cp.\"label\")\n  FROM \"category_product\" cp\n WHERE cp.\"product_id\" = p.\"id\" AND cp.\"category_id\" = p.\"category_id\" AND p.\"button_label\" IS NULL\n   AND cp.\"label\" IS NOT NULL AND btrim(cp.\"label\") <> '' AND btrim(cp.\"label\") <> p.\"name\";\n-- los productos que ya se usan como calificativos (categoría CALIFICATIVOS) quedan marcados\nUPDATE \"product\" p SET \"qualifier\" = TRUE\n  FROM \"category\" c WHERE c.\"id\" = p.\"category_id\" AND upper(c.\"name\") = 'CALIFICATIVOS' AND NOT p.\"qualifier\";\n\nALTER TABLE \"question\" ADD COLUMN IF NOT EXISTS \"plu\" INTEGER;\nALTER TABLE \"question\" ADD COLUMN IF NOT EXISTS \"description\" VARCHAR(300);\nALTER TABLE \"question\" ADD COLUMN IF NOT EXISTS \"required\" BOOLEAN NOT NULL DEFAULT FALSE;\nALTER TABLE \"question\" ADD COLUMN IF NOT EXISTS \"answer_type\" VARCHAR(10) NOT NULL DEFAULT 'unica';\nALTER TABLE \"question\" ADD COLUMN IF NOT EXISTS \"course_name\" VARCHAR(40);\nALTER TABLE \"question\" ADD COLUMN IF NOT EXISTS \"translations\" JSONB NOT NULL DEFAULT '{}'::jsonb;\nALTER TABLE \"question\" DROP CONSTRAINT IF EXISTS \"ck_question_answer_type\";\nALTER TABLE \"question\" ADD CONSTRAINT \"ck_question_answer_type\" CHECK (\"answer_type\" IN ('unica', 'multiple'));\n-- lo que ya hacían las preguntas: obligatoria si pide al menos una respuesta; múltiple si deja más de una\nUPDATE \"question\" SET \"required\" = (\"min_answers\" > 0),\n       \"answer_type\" = CASE WHEN \"max_answers\" > 1 THEN 'multiple' ELSE 'unica' END;\nCOMMENT ON COLUMN \"question\".\"plu\" IS 'PLU de la pregunta (Carta), si tiene';\nCOMMENT ON COLUMN \"question\".\"required\" IS 'Obligatoria: no se puede saltar';\nCOMMENT ON COLUMN \"question\".\"answer_type\" IS 'unica (una respuesta) o multiple (varias)';\nCOMMENT ON COLUMN \"question\".\"course_name\" IS 'Nombre del pase: Bebida, Primero, Segundo, Postre';\nCOMMENT ON COLUMN \"question\".\"translations\" IS 'Textos por idioma: name, description';\n\nALTER TABLE \"question_answer\" ADD COLUMN IF NOT EXISTS \"translations\" JSONB NOT NULL DEFAULT '{}'::jsonb;\nCOMMENT ON COLUMN \"question_answer\".\"translations\" IS 'Texto de la respuesta por idioma: {\"en\":{\"label\":\"…\"}}';\n\n-- catalog_release: cada carga del Manager (completa, precios, nombres o retirar)\nALTER TABLE \"catalog_release\" ADD COLUMN IF NOT EXISTS \"publication_id\" VARCHAR(60) NOT NULL DEFAULT '';\nALTER TABLE \"catalog_release\" ADD COLUMN IF NOT EXISTS \"publication_type\" VARCHAR(20);\nALTER TABLE \"catalog_release\" ADD COLUMN IF NOT EXISTS \"menu\" VARCHAR(60);\nALTER TABLE \"catalog_release\" ADD COLUMN IF NOT EXISTS \"price_line\" VARCHAR(60);\nALTER TABLE \"catalog_release\" ADD COLUMN IF NOT EXISTS \"store_code\" VARCHAR(20);\nALTER TABLE \"catalog_release\" ADD COLUMN IF NOT EXISTS \"note\" VARCHAR(300);\nALTER TABLE \"catalog_release\" ADD COLUMN IF NOT EXISTS \"result\" JSONB;\nALTER TABLE \"catalog_release\" ADD COLUMN IF NOT EXISTS \"decided_by\" VARCHAR(60);\nALTER TABLE \"catalog_release\" DROP CONSTRAINT IF EXISTS \"catalog_release_kind_check\";\nALTER TABLE \"catalog_release\" DROP CONSTRAINT IF EXISTS \"ck_catalog_release_kind\";\nALTER TABLE \"catalog_release\" ADD CONSTRAINT \"ck_catalog_release_kind\" CHECK (\"kind\" IN ('full', 'prices', 'names', 'withdraw'));\nALTER TABLE \"catalog_release\" DROP CONSTRAINT IF EXISTS \"catalog_release_status_check\";\nALTER TABLE \"catalog_release\" DROP CONSTRAINT IF EXISTS \"ck_catalog_release_status\";\nALTER TABLE \"catalog_release\" ADD CONSTRAINT \"ck_catalog_release_status\"\n  CHECK (\"status\" IN ('pending', 'confirm', 'applied', 'unchanged', 'failed', 'superseded', 'cancelled'));\nALTER TABLE \"catalog_release\" DROP CONSTRAINT IF EXISTS \"uq_catalog_release_store_id_release_version\";\nALTER TABLE \"catalog_release\" DROP CONSTRAINT IF EXISTS \"uq_catalog_release_publication\";\nALTER TABLE \"catalog_release\" ADD CONSTRAINT \"uq_catalog_release_publication\" UNIQUE (\"store_id\", \"publication_id\", \"release_version\");\nCOMMENT ON COLUMN \"catalog_release\".\"kind\" IS 'full = carta completa · prices = solo precios · names = solo nombres · withdraw = retirar la carta';\nCOMMENT ON COLUMN \"catalog_release\".\"status\" IS 'pending (espera su hora) · confirm (retirar: espera a un encargado) · applied · unchanged (ya estaba igual) · failed · superseded (llegó otra más nueva) · cancelled (no se aplicó)';\nCOMMENT ON COLUMN \"catalog_release\".\"publication_id\" IS 'Id de la publicación en Carta: publicación + versión + tienda = una carga';\nCOMMENT ON COLUMN \"catalog_release\".\"result\" IS 'Qué hizo al aplicarse (recuentos y versión de la configuración)';\nCOMMENT ON COLUMN \"catalog_release\".\"decided_by\" IS 'Quién la confirmó o la canceló (retirar)';\n\n-- ───────────────────────── 2. Canales: solo COMIDA y BEBIDA ─────────────────────────\nALTER TABLE \"print_channel\" ADD COLUMN IF NOT EXISTS \"code\" VARCHAR(20);\nCOMMENT ON COLUMN \"print_channel\".\"code\" IS 'COMIDA o BEBIDA: los dos canales del Manager (fijos). null = canal de ticket';\n-- tiendas antiguas: BARRA es la de bebidas\nUPDATE \"print_channel\" c SET \"name\" = 'BEBIDA'\n WHERE c.\"name\" = 'BARRA' AND c.\"kind\" = 'kitchen' AND c.\"copy_of_id\" IS NULL\n   AND NOT EXISTS (SELECT 1 FROM \"print_channel\" x WHERE x.\"store_id\" = c.\"store_id\" AND x.\"name\" = 'BEBIDA');\n-- el que falte se crea con la impresora de su tipo (cocina para COMIDA, barra para BEBIDA) o, si no hay, la primera activa\nINSERT INTO \"print_channel\" (\"id\", \"store_id\", \"name\", \"active\", \"kind\", \"printer_id\")\nSELECT gen_random_uuid(), st.\"id\", n.name, TRUE, 'kitchen',\n       (SELECT p.\"id\" FROM \"printer\" p WHERE p.\"store_id\" = st.\"id\" AND p.\"active\"\n         ORDER BY (p.\"kind\" = n.pk) DESC, (p.\"kind\" <> 'ticket') DESC, p.\"name\" LIMIT 1)\n  FROM \"store\" st CROSS JOIN (VALUES ('COMIDA', 'kitchen'), ('BEBIDA', 'bar')) n(name, pk)\n WHERE NOT EXISTS (SELECT 1 FROM \"print_channel\" c WHERE c.\"store_id\" = st.\"id\" AND c.\"name\" = n.name);\nUPDATE \"print_channel\" SET \"code\" = \"name\", \"kind\" = 'kitchen', \"copy_of_id\" = NULL, \"active\" = TRUE\n WHERE \"name\" IN ('COMIDA', 'BEBIDA');\nDO $$\nDECLARE gone TEXT;\nBEGIN\n  SELECT string_agg(DISTINCT \"name\", ', ' ORDER BY \"name\") INTO gone FROM \"print_channel\" WHERE \"kind\" = 'kitchen' AND \"code\" IS NULL;\n  IF gone IS NOT NULL THEN\n    RAISE NOTICE '0035 · canales borrados (solo quedan COMIDA y BEBIDA): %', gone;\n  END IF;\nEND $$;\n-- las copias primero (copy_of_id no borra en cascada) y después el resto; sus productos e impresoras por equipo caen en cascada\nDELETE FROM \"print_channel\" WHERE \"kind\" = 'kitchen' AND \"code\" IS NULL AND \"copy_of_id\" IS NOT NULL;\nDELETE FROM \"print_channel\" WHERE \"kind\" = 'kitchen' AND \"code\" IS NULL;\nDROP INDEX IF EXISTS \"uq_print_channel_code\";\nCREATE UNIQUE INDEX \"uq_print_channel_code\" ON \"print_channel\" (\"store_id\", \"code\") WHERE \"code\" IS NOT NULL;\nALTER TABLE \"print_channel\" DROP CONSTRAINT IF EXISTS \"ck_print_channel_code\";\nALTER TABLE \"print_channel\" ADD CONSTRAINT \"ck_print_channel_code\" CHECK (\n  (\"code\" IS NULL AND \"kind\" = 'ticket')\n  OR (\"code\" IS NOT NULL AND \"code\" IN ('COMIDA', 'BEBIDA') AND \"kind\" = 'kitchen' AND \"copy_of_id\" IS NULL));\n-- los productos solo van a COMIDA o BEBIDA (nunca a un canal de ticket)\nDELETE FROM \"product_channel\" pc USING \"print_channel\" c WHERE c.\"id\" = pc.\"channel_id\" AND c.\"code\" IS NULL;\n\n-- ───────────────────────── 3. Cola de impresión ─────────────────────────\nCREATE TABLE IF NOT EXISTS \"print_job\" (\n  \"id\" UUID NOT NULL,\n  \"store_id\" UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"seq\" BIGSERIAL NOT NULL,\n  \"kind\" VARCHAR(20) NOT NULL,\n  \"title\" VARCHAR(120) NOT NULL,\n  \"order_id\" UUID,\n  \"account_id\" UUID,\n  \"station_id\" UUID,\n  \"channel\" VARCHAR(40) NOT NULL,\n  \"printer_name\" VARCHAR(60) NOT NULL,\n  \"connection\" VARCHAR(120) NOT NULL,\n  \"job\" JSONB NOT NULL,\n  \"line_printer_ids\" JSONB NOT NULL DEFAULT '[]'::jsonb,\n  \"status\" VARCHAR(12) NOT NULL DEFAULT 'pending',\n  \"attempts\" SMALLINT NOT NULL DEFAULT 0,\n  \"last_error\" VARCHAR(300),\n  \"next_try_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"created_by\" VARCHAR(60),\n  \"created_device\" VARCHAR(40),\n  \"created_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"printed_at\" TIMESTAMPTZ(3),\n  \"updated_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  PRIMARY KEY (\"id\"),\n  CONSTRAINT \"ck_print_job_status\" CHECK (\"status\" IN ('pending', 'printing', 'printed', 'failed', 'cancelled')),\n  CONSTRAINT \"ck_print_job_kind\" CHECK (\"kind\" IN ('kitchen', 'void', 'prebill', 'invoice', 'cutx', 'cutz', 'count', 'oot', 'test', 'drawer', 'notice'))\n);\nCREATE INDEX IF NOT EXISTS \"ix_print_job_pending\" ON \"print_job\" (\"status\", \"next_try_at\") WHERE \"status\" IN ('pending', 'printing');\nCREATE INDEX IF NOT EXISTS \"ix_print_job_store_created\" ON \"print_job\" (\"store_id\", \"created_at\" DESC);\nCREATE INDEX IF NOT EXISTS \"ix_print_job_order\" ON \"print_job\" (\"order_id\") WHERE \"order_id\" IS NOT NULL;\nCREATE OR REPLACE TRIGGER \"trg_print_job_updated_at\" BEFORE UPDATE ON \"print_job\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"print_job\" IS 'Cola de impresión: cada papel que hay que sacar. Lo imprime la API en segundo plano (guardar no espera a la impresora)';\nCOMMENT ON COLUMN \"print_job\".\"seq\" IS 'Orden de llegada: cada impresora saca sus papeles en este orden';\nCOMMENT ON COLUMN \"print_job\".\"kind\" IS 'kitchen (comanda, marchar, cambio de pase) · void (anulación) · prebill · invoice · cutx · cutz · count (arqueo) · oot (QR) · test · drawer · notice';\nCOMMENT ON COLUMN \"print_job\".\"job\" IS 'El papel ya armado (líneas del ticket, cajón, logo): se imprime tal cual aunque cambie la configuración';\nCOMMENT ON COLUMN \"print_job\".\"line_printer_ids\" IS 'order_line_printer que quedan «impresas» cuando sale (comandas)';\nCOMMENT ON COLUMN \"print_job\".\"status\" IS 'pending · printing · printed · failed (5 min sin salir: Gestiones › Impresiones) · cancelled';\nCOMMENT ON COLUMN \"print_job\".\"next_try_at\" IS 'Siguiente intento: 2, 5, 15 y 30 s y después cada minuto';\n\n\n-- 0036 · 1.2.271 (16/11/2026): equipos que no cambian de estación.\n-- Última vez que cada equipo se identificó (POST /devices/identify y POST /devices/claim): en Ajustes › Equipos se ve\n-- si un equipo lleva tiempo sin conectar o si dos equipos parecen el mismo.\nALTER TABLE \"station\" ADD COLUMN IF NOT EXISTS \"last_seen_at\" timestamptz;\nCOMMENT ON COLUMN \"station\".\"last_seen_at\" IS 'Última vez que el equipo de esta estación se identificó por su UUID';\n-- «Iniciar el día» (abrir el periodo) como permiso propio, igual que en el TPV (Ajustes › Perfiles › Funciones): por\n-- defecto el Cajero (y el Administrador, que lo tiene todo). Antes no existía en la API y guardar el perfil Cajero desde el TPV daba «Permisos que no\n-- existen». Abrir el periodo vale con este permiso o con funciones.periodo (que además cierra).\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\") VALUES\n  ('funciones.iniciarDia', 'Funciones', 'Iniciar el día (abrir el periodo)', 34)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT p.\"id\", 'funciones.iniciarDia', p.\"store_id\" FROM \"user_profile\" p WHERE p.\"code\" IN ('CAJERO', 'ADMIN')\nON CONFLICT DO NOTHING;\n-- Permiso para vincular un equipo a una estación desde el propio equipo: el mismo de Ajustes › Estaciones\n-- (ajustes.estaciones), no hace falta uno nuevo.\n\n\n-- 0037 · 1.2.274 (16/11/2026): arqueo pedido por auditoría (reuniones con el Area Manager y con auditoría).\n-- 1) Apertura con la base contada, corte X contado en pantalla y arqueos de auditoría: cada conteo es un cash_movement\n--    «count» con su tipo, lo esperado en ese momento, las propinas y la diferencia (así se puede reimprimir y auditar).\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"count_type\" VARCHAR(12);\nALTER TABLE \"cash_movement\" DROP CONSTRAINT IF EXISTS \"ck_cash_movement_count_type\";\nALTER TABLE \"cash_movement\" ADD CONSTRAINT \"ck_cash_movement_count_type\"\n  CHECK (\"count_type\" IS NULL OR \"count_type\" IN ('arqueo', 'apertura', 'cortex', 'auditoria'));\nUPDATE \"cash_movement\" SET \"count_type\" = 'arqueo' WHERE \"kind\" = 'count' AND \"count_type\" IS NULL;\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"expected_cash\" NUMERIC(10,2);\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"expected_card\" NUMERIC(10,2);\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"cash_tips\" NUMERIC(10,2);\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"card_tips\" NUMERIC(10,2);\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"tips_confirmed\" BOOLEAN;\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"difference\" NUMERIC(10,2);\nCOMMENT ON COLUMN \"cash_movement\".\"count_type\" IS 'Conteo: arqueo, apertura (base de la mañana), cortex (corte X contado) o auditoria';\nCOMMENT ON COLUMN \"cash_movement\".\"expected_card\" IS 'Tarjeta esperada en los datáfonos (ventas + propinas con tarjeta) al contar';\n\n-- 2) Caja chica: fondo fijo del gerente, aparte del cajón (no entra en el arqueo). Se gasta con motivo y se repone.\nALTER TABLE \"store_parameters\" ADD COLUMN IF NOT EXISTS \"petty_cash_limit\" NUMERIC(10,2) NOT NULL DEFAULT 50;\nALTER TABLE \"store_parameters\" DROP CONSTRAINT IF EXISTS \"ck_store_parameters_petty_cash_limit\";\nALTER TABLE \"store_parameters\" ADD CONSTRAINT \"ck_store_parameters_petty_cash_limit\"\n  CHECK (\"petty_cash_limit\" > 0 AND \"petty_cash_limit\" <= 10000);\nCOMMENT ON COLUMN \"store_parameters\".\"petty_cash_limit\" IS 'Caja chica: fondo fijo (50 € por defecto); ningún gasto lo pasa';\nCREATE TABLE IF NOT EXISTS \"petty_cash_movement\" (\n  \"id\" UUID PRIMARY KEY,\n  \"store_id\" UUID NOT NULL REFERENCES \"store\"(\"id\"),\n  \"kind\" VARCHAR(12) NOT NULL CHECK (\"kind\" IN ('expense', 'replenish')),\n  \"amount\" NUMERIC(10,2) NOT NULL CHECK (\"amount\" > 0),\n  \"reason\" VARCHAR(200) NOT NULL,\n  \"balance_after\" NUMERIC(10,2) NOT NULL CHECK (\"balance_after\" >= 0),\n  \"period_id\" UUID REFERENCES \"sales_period\"(\"id\"),\n  \"station_id\" UUID REFERENCES \"station\"(\"id\"),\n  \"by_user_id\" UUID REFERENCES \"app_user\"(\"id\"),\n  \"by_user_name\" VARCHAR(60) NOT NULL,\n  \"by_device\" VARCHAR(40),\n  \"by_at\" TIMESTAMP(3) WITH TIME ZONE NOT NULL,\n  \"created_at\" TIMESTAMP(3) WITH TIME ZONE NOT NULL DEFAULT now()\n);\nCREATE INDEX IF NOT EXISTS \"ix_petty_cash_movement_store_at\" ON \"petty_cash_movement\" (\"store_id\", \"by_at\" DESC);\nCREATE INDEX IF NOT EXISTS \"ix_petty_cash_movement_period\" ON \"petty_cash_movement\" (\"period_id\");\nCREATE INDEX IF NOT EXISTS \"ix_petty_cash_movement_station\" ON \"petty_cash_movement\" (\"station_id\");\nCREATE INDEX IF NOT EXISTS \"ix_petty_cash_movement_user\" ON \"petty_cash_movement\" (\"by_user_id\");\nCOMMENT ON TABLE \"petty_cash_movement\" IS 'Caja chica (fondo del gerente, aparte del cajón): gastos con motivo y reposiciones; saldo después de cada uno';\n\n-- 3) Permisos: arqueo de auditoría (Administrador) y caja chica (Administrador y Encargado)\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\") VALUES\n  ('funciones.arqueoAuditoria', 'Funciones', 'Arqueo de auditoría', 35),\n  ('funciones.cajaChica', 'Funciones', 'Caja chica', 36)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT p.\"id\", 'funciones.arqueoAuditoria', p.\"store_id\" FROM \"user_profile\" p WHERE p.\"code\" = 'ADMIN'\nON CONFLICT DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT p.\"id\", 'funciones.cajaChica', p.\"store_id\" FROM \"user_profile\" p WHERE p.\"code\" IN ('ADMIN', 'ADMIN_LOCAL')\nON CONFLICT DO NOTHING;\n\n\n-- 0038 · 1.2.281 (17/11/2026): los equipos (TPV y PDA) se reconocen SOLO por su IP; el UUID del equipo ya no se usa.\n-- 1) Fuera la regla «un UUID, una sola estación» (0011): era la que daba «Ese UUID de equipo ya lo tiene otra estación activa».\n-- 2) Se vacía el UUID de todas las estaciones: así nadie queda atado a un UUID viejo (la API ya no lo mira).\n-- 3) Si alguna estación tenía UUID, sube la versión de la configuración para que cada TPV y PDA lo relea al entrar.\nDROP INDEX IF EXISTS \"uq_station_device_uuid\";\nUPDATE \"store\" s SET \"config_version\" = s.\"config_version\" + 1\n WHERE EXISTS (SELECT 1 FROM \"station\" t WHERE t.\"store_id\" = s.\"id\" AND t.\"device_uuid\" IS NOT NULL);\nUPDATE \"station\" SET \"device_uuid\" = NULL, \"version\" = \"version\" + 1, \"updated_at\" = now() WHERE \"device_uuid\" IS NOT NULL;\nCOMMENT ON COLUMN \"station\".\"device_uuid\" IS 'Sin uso desde 1.2.281: los equipos se reconocen por su IP (station.ip)';\n\n\n-- 0039 · 1.2.281 (17/11/2026): la caja chica deja de ser un fondo fijo del gerente (50 €).\n-- 1) Se ingresa efectivo libremente (p. ej. 100 € para los gastos del día): nuevo tipo «deposit».\n-- 2) Cada gasto puede llevar la foto del ticket (la sube la PDA › Gestiones › Cargar ticket de caja chica).\n-- 3) El saldo ya no parte del fondo: parte de 0. Para no cambiar el saldo de las tiendas que ya la usaban,\n--    el fondo de antes queda como un ingreso «Saldo inicial» justo antes del primer apunte (no se borra nada).\nALTER TABLE \"petty_cash_movement\" DROP CONSTRAINT IF EXISTS \"petty_cash_movement_kind_check\";\nALTER TABLE \"petty_cash_movement\" ADD CONSTRAINT \"petty_cash_movement_kind_check\" CHECK (\"kind\" IN ('expense', 'replenish', 'deposit'));\nALTER TABLE \"petty_cash_movement\" ADD COLUMN IF NOT EXISTS \"photo\" TEXT;\nALTER TABLE \"petty_cash_movement\" DROP CONSTRAINT IF EXISTS \"ck_petty_cash_movement_photo\";\nALTER TABLE \"petty_cash_movement\" ADD CONSTRAINT \"ck_petty_cash_movement_photo\"\n  CHECK (\"photo\" IS NULL OR (\"photo\" LIKE 'data:image/%' AND length(\"photo\") <= 3000000));\nCOMMENT ON COLUMN \"petty_cash_movement\".\"photo\" IS 'Foto del ticket del gasto (data:image/jpeg;base64, reducida por el TPV); vacía si no se hizo';\nINSERT INTO \"petty_cash_movement\" (id, store_id, kind, amount, reason, balance_after, by_user_name, by_device, by_at)\nSELECT gen_random_uuid(), m.store_id, 'deposit', p.petty_cash_limit, 'Saldo inicial (fondo de antes de la 1.2.281)', p.petty_cash_limit,\n       'Sistema', 'migración 0039', m.first_at - interval '1 millisecond'\n  FROM (SELECT store_id, min(by_at) first_at FROM \"petty_cash_movement\" GROUP BY store_id) m\n  JOIN \"store_parameters\" p ON p.store_id = m.store_id\n WHERE NOT EXISTS (SELECT 1 FROM \"petty_cash_movement\" x WHERE x.store_id = m.store_id AND x.kind = 'deposit');\nCOMMENT ON COLUMN \"store_parameters\".\"petty_cash_limit\" IS 'Sin uso desde 1.2.281: la caja chica parte de 0 y se le ingresa efectivo';\nCOMMENT ON TABLE \"petty_cash_movement\" IS 'Caja chica (aparte del cajón): ingresos de efectivo, gastos con descripción y foto del ticket; saldo después de cada uno';\n\n-- 4) Un corte X (o arqueo) mal escrito se puede eliminar desde Caja › Resumen: queda anulado (no se borra), con quién y cuándo.\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"voided_at\" TIMESTAMP(3) WITH TIME ZONE;\nALTER TABLE \"cash_movement\" ADD COLUMN IF NOT EXISTS \"voided_by_name\" VARCHAR(60);\nCOMMENT ON COLUMN \"cash_movement\".\"voided_at\" IS 'Corte X o arqueo eliminado desde Caja › Resumen (por error al escribirlo): ya no se enseña ni cuenta';\n\n\n-- 0040 · 1.2.282 (17/11/2026)\n-- 1) Un apunte de caja chica (ingreso o gasto) se puede eliminar desde Caja › Caja chica: queda anulado (no se borra),\n--    con quién y cuándo; ya no cuenta en el saldo ni sale en los movimientos ni en los tickets de corte X y Z.\n--    Los cortes X y arqueos NO se eliminan (las columnas voided_* de cash_movement de la 0039 se quedan sin uso).\nALTER TABLE \"petty_cash_movement\" ADD COLUMN IF NOT EXISTS \"voided_at\" TIMESTAMP(3) WITH TIME ZONE;\nALTER TABLE \"petty_cash_movement\" ADD COLUMN IF NOT EXISTS \"voided_by_name\" VARCHAR(60);\nCOMMENT ON COLUMN \"petty_cash_movement\".\"voided_at\" IS 'Apunte de caja chica eliminado (por error): ya no cuenta en el saldo ni se enseña';\nCOMMENT ON COLUMN \"petty_cash_movement\".\"voided_by_name\" IS 'Quién eliminó el apunte';\nCOMMENT ON COLUMN \"cash_movement\".\"voided_at\" IS 'Sin uso desde la 1.2.282: los cortes X y arqueos no se eliminan';\n\n-- 2) Imagen del botón de cada forma de pago en Cobrar (Ajustes › Formas de pago › Imagen del botón), 220 × 56 a doble resolución.\n--    En la base para que la vean todas las cajas y PDAs (antes no había dónde guardarla).\nALTER TABLE \"payment_method\" ADD COLUMN IF NOT EXISTS \"image\" TEXT;\nALTER TABLE \"payment_method\" DROP CONSTRAINT IF EXISTS \"ck_payment_method_image\";\nALTER TABLE \"payment_method\" ADD CONSTRAINT \"ck_payment_method_image\"\n  CHECK (\"image\" IS NULL OR (\"image\" LIKE 'data:image/%' AND length(\"image\") <= 300000));\nCOMMENT ON COLUMN \"payment_method\".\"image\" IS 'Imagen del botón en Cobrar (data:image/png;base64, 440 × 112); vacía = se ve el nombre';\n\n\n-- 0041 · 1.2.285 (20/11/2026)\n-- 1) Descuentos con «Formulario»: los datos que hay que pedir al aplicar el descuento al cobrar (Ajustes › Facturación › Descuentos).\n--    Lista de campos: [{\"label\":\"DNI\",\"type\":\"text\",\"req\":true}, …]; tipos text, number, date, tel o email; [] = no pide nada.\n--    Lo que se rellena al cobrar queda en el historial de la cuenta (order_event «discountForm»).\nALTER TABLE \"discount\" ADD COLUMN IF NOT EXISTS \"form\" JSONB NOT NULL DEFAULT '[]'::jsonb;\nALTER TABLE \"discount\" DROP CONSTRAINT IF EXISTS \"ck_discount_form\";\nALTER TABLE \"discount\" ADD CONSTRAINT \"ck_discount_form\" CHECK (jsonb_typeof(\"form\") = 'array' AND jsonb_array_length(\"form\") <= 10);\nCOMMENT ON COLUMN \"discount\".\"form\" IS 'Campos que se piden al aplicar el descuento ([{label,type,req}], máx. 10); [] = ninguno';\n\n-- 2) Roles y accesos de lo nuevo\n--    pedido.ordenImpresion: arrastrar lo «Por enviar» para cambiar el orden de impresión (quien puede enviar)\n--    funciones.miVenta: «Venta · t. · tk» del camarero en la cabecera de la PDA (todos)\n--    funciones.corteVerSistema: ver Sistema y Propinas en el corte X (nadie: el corte X va a ciegas)\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\") VALUES\n  ('pedido.ordenImpresion', 'Pedido', 'Cambiar el orden de impresión', 19),\n  ('funciones.miVenta', 'Funciones', 'Ver mi venta (cabecera de la PDA)', 37),\n  ('funciones.corteVerSistema', 'Funciones', 'Ver Sistema y Propinas en el corte X', 38)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT pp.\"profile_id\", 'pedido.ordenImpresion', pp.\"store_id\" FROM \"profile_permission\" pp WHERE pp.\"permission_code\" = 'pedido.enviar'\nON CONFLICT DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT p.\"id\", 'funciones.miVenta', p.\"store_id\" FROM \"user_profile\" p\nON CONFLICT DO NOTHING;\n\n\n-- 0042 · 1.2.289 (20/11/2026)\n-- Ajustes › Funcionalidades: funciones desactivadas para todo el sistema (nadie las puede usar, ni con la clave de un encargado).\n-- Lista de claves: transferir, pasarCuenta, separar, eliminaciones, descuentos, clientes, reabrir, abonar, abrirCajon, cajaChica,\n-- pedidos, editarPlano, ordenImpresion, miVenta (packages/domain/src/features.ts). [] = todo activo.\nALTER TABLE \"store_parameters\" ADD COLUMN IF NOT EXISTS \"disabled_features\" JSONB NOT NULL DEFAULT '[]'::jsonb;\nALTER TABLE \"store_parameters\" DROP CONSTRAINT IF EXISTS \"ck_store_parameters_disabled_features\";\nALTER TABLE \"store_parameters\" ADD CONSTRAINT \"ck_store_parameters_disabled_features\"\n  CHECK (jsonb_typeof(\"disabled_features\") = 'array' AND jsonb_array_length(\"disabled_features\") <= 30);\nCOMMENT ON COLUMN \"store_parameters\".\"disabled_features\" IS 'Ajustes › Funcionalidades: claves de las funciones desactivadas para todo el sistema; [] = todo activo';\n\n\n-- 0043 · 1.2.292 (20/11/2026)\n-- 1) Permiso propio para pasar un producto ya enviado a otra mesa (antes usaba el de transferir la mesa).\n--    Por defecto lo tiene quien ya podía transferir.\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\") VALUES\n  ('mesas.transferirProducto', 'Mesas', 'Transferir un producto a otra mesa', 3)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT pp.\"profile_id\", 'mesas.transferirProducto', pp.\"store_id\" FROM \"profile_permission\" pp WHERE pp.\"permission_code\" = 'mesas.transferir'\nON CONFLICT DO NOTHING;\n\n-- 2) Fuera el permiso «Reabrir mesa»: una cuenta cobrada no se reabre nunca (regla del 03/11/2026).\nDELETE FROM \"profile_permission\" WHERE \"permission_code\" = 'cobro.reabrir';\nDELETE FROM \"permission\" WHERE \"code\" = 'cobro.reabrir';\n\n-- 3) Cierre de periodo: lo contado de TODAS las formas de pago dadas de alta, no solo efectivo y tarjeta.\n--    [{\"method\":\"gourmet\",\"name\":\"Gourmet\",\"counted\":12.5,\"expected\":12.5}, …]\nALTER TABLE \"cash_closing\" ADD COLUMN IF NOT EXISTS \"method_detail\" JSONB;\nALTER TABLE \"cash_closing\" DROP CONSTRAINT IF EXISTS \"ck_cash_closing_method_detail\";\nALTER TABLE \"cash_closing\" ADD CONSTRAINT \"ck_cash_closing_method_detail\"\n  CHECK (\"method_detail\" IS NULL OR (jsonb_typeof(\"method_detail\") = 'array' AND jsonb_array_length(\"method_detail\") <= 40));\nCOMMENT ON COLUMN \"cash_closing\".\"method_detail\" IS 'Contado de cada forma de pago en el cierre ([{method,name,counted,expected}]); efectivo y tarjeta también van en counted_cash y counted_card';\n\n-- 4) Descuento con «Formulario»: lo rellenado al aplicarlo se guarda con el descuento de la cuenta y sale en la factura.\n--    [{\"label\":\"DNI\",\"value\":\"12345678Z\"}, …]\nALTER TABLE \"account_discount\" ADD COLUMN IF NOT EXISTS \"form_data\" JSONB;\nALTER TABLE \"account_discount\" DROP CONSTRAINT IF EXISTS \"ck_account_discount_form_data\";\nALTER TABLE \"account_discount\" ADD CONSTRAINT \"ck_account_discount_form_data\"\n  CHECK (\"form_data\" IS NULL OR (jsonb_typeof(\"form_data\") = 'array' AND jsonb_array_length(\"form_data\") <= 10));\nCOMMENT ON COLUMN \"account_discount\".\"form_data\" IS 'Lo rellenado en el formulario del descuento ([{label,value}]); sale en la factura';\n\n\n-- 0044 · 1.2.293 (20/11/2026, noche) · decisiones del dueño\n-- 1) Agotado y desactivar un producto en la tienda valen hasta el día siguiente: al abrir el periodo siguiente se\n--    reactivan solos (la API lo hace al abrir). «local_off» marca lo desactivado en la tienda; lo desactivado por el\n--    Manager (sync de la carta) no lleva la marca y no se toca.\nALTER TABLE \"product\" ADD COLUMN IF NOT EXISTS \"local_off\" BOOLEAN NOT NULL DEFAULT FALSE;\nCOMMENT ON COLUMN \"product\".\"local_off\" IS 'Desactivado en la tienda (no desde el Manager): se reactiva solo al abrir el periodo siguiente';\n\n-- 2) Tablero de pedidos (delivery): por defecto solo el Cajero (y el Administrador, que lo tiene todo). Se puede dar a\n--    otros perfiles en Ajustes › Accesos.\nDELETE FROM \"profile_permission\" pp\n USING \"user_profile\" p\n WHERE p.\"id\" = pp.\"profile_id\" AND pp.\"permission_code\" = 'funciones.pedidos' AND p.\"code\" NOT IN ('CAJERO', 'ADMIN');\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT p.\"id\", 'funciones.pedidos', p.\"store_id\" FROM \"user_profile\" p WHERE p.\"code\" IN ('CAJERO', 'ADMIN')\nON CONFLICT DO NOTHING;\n\n-- 3) Un solo periodo por día (fecha de apertura en hora de España): lo comprueba la API al abrir (409 PERIOD_DAY_USED).\nCREATE INDEX IF NOT EXISTS \"ix_sales_period_store_opened\" ON \"sales_period\" (\"store_id\", \"opened_by_at\");\n", "tests": {"engine": "PostgreSQL 16.15 (Ubuntu 16.15-0ubuntu0.24.04.1)", "ranAt": "2026-11-21T12:52:57+00:00", "script": "japp-db · npm test (esquema + datos de arranque + migraciones 0001…0044)", "results": [{"area": "Datos de arranque", "test": "una tienda CT 03 conectada a japp.grupocyt.com.es", "ok": true, "detail": "correcto", "expected": "correcto", "ms": 4.5}, {"area": "Datos de arranque", "test": "carta: 487 productos, todos con IVA y precio ≥ 0", "ok": true, "detail": "correcto", "expected": "correcto", "ms": 2.3}, {"area": "Datos de arranque", "test": "66 permisos «módulo.tecla» (47 de arranque + 2 de la 0005 + 1 de la 0008 + 1 de la 0012 + 2 de la 0025 + 1 de la 0028 + 5 de la 0032 + 1 de la 0033 + 1 de la 0036 + 2 de la 0037 + 3 de la 0041 + 1 − 1 de la 0043), iguales a los del dominio", "ok": true, "detail": "correcto", "expected": "correcto", "ms": 3.5}, {"area": "Datos de arranque", "test": "el administrador tiene todos los permisos menos «Ver Sistema en el corte X» (0041: nadie)", "ok": true, "detail": "correcto", "expected": "correcto", "ms": 1.5}, {"area": "Datos de arranque", "test": "usuarios con PIN cifrado en bcrypt (nunca en claro); Jeison entra con su PIN de pruebas", "ok": true, "detail": "correcto", "expected": "correcto", "ms": 142.3}, {"area": "Datos de arranque", "test": "series de factura configuradas", "ok": true, "detail": "correcto", "expected": "correcto", "ms": 1.7}, {"area": "Estructura", "test": "50 tablas de la línea base + idempotency_key (0001) + 4 de la 0005 + 2 de la 0009 + oot_token e invoice_credit_line (0012) + order_incident (0015) + service_shift y service_sla (0017) + customer_display y display_media (0021) + system_branding (0023) + week_note (0024) + 5 de delivery (0025) + order_reconnection (0028) + print_job (0035) + petty_cash_movement (0037) + schema_migrations, todas con clave primaria", "ok": true, "detail": "correcto", "expected": "correcto", "ms": 5.5}, {"area": "Estructura", "test": "al menos 127 claves foráneas, y todas con índice en la columna de origen", "ok": true, "detail": "correcto", "expected": "correcto", "ms": 2.6}, {"area": "Estructura", "test": "todas las tablas salvo company, permission, schema_migrations y store llevan store_id", "ok": true, "detail": "correcto", "expected": "correcto", "ms": 5.5}, {"area": "Estructura", "test": "dinero siempre NUMERIC (nunca float/re function rowY(t,c){ const i=T[t].cols.findIndex(x=>x.n===c); const p=W.pos[t]; return p.y+HH+(i<0?0:i)*RH+RH/2+2; }
function edgePath(a,ac,b,bc){ const A=W.pos[a],B=W.pos[b]; const ya=rowY(a,ac), yb=rowY(b,bc);

  const right=B.x+B.w/2>A.x+A.w/2, xa=right?A.x+A.w:A.x, xb=right?B.x:B.x+B.w, dx=Math.max(50,Math.abs(xb-xa)/2);
  return `M${xa} ${ya} C${xa+(right?dx:-dx)} ${ya},${xb+(right?-dx:dx)} ${yb},${xb} ${yb}`; }
function buildEr(){ W.done=true; layout(); const vp=$("#vp");

  W.tb={}; D.tables.forEach(t=>{ const p=W.pos[t.n], g=el("g",{class:"tb","data-t":t.n,transform:`translate(${p.x},${p.y})`},tg); W.tb[t.n]=g;
    el("rect",{class:"bx",width:p.w,height:p.h,rx:10},g); el("rect",{class:"hd",width:p.w,height:HH,rx:10,fill:gcol(t.g)},g); el("rect",{y:HH-10,width:p.w,height:10,fill:gcol(t.g)},g);
    const tn=el("text",{x:12,y:20,class:"tn"},g); tn.textContent=t.n;

function applyOff(){ D.tables.forEach(t=>{ W.tb[t.n].style.display=S.off.includes(t.g)?"none":""; }); W.edges.forEach(e=>{ e.el.style.display=S.off.includes(T[e.from].g)||S.off.includes(T[e.to].g)?"none":""; }); }

function bounds(){ let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9; (W.gbox||[]).forEach(b=>{ x1=Math.min(x1,b.x); y1=Math.min(y1,b.y); x2=Math.max(x2,b.x+b.w); y2=Math.max(y2,b.y+b.h); }); return {x1,y1,x2,y2}; }

function zoomAt(f,cx,cy){ const k=Math.max(.08,Math.min(3,W.k*f)); W.tx=cx-(cx-W.tx)*(k/W.k); W.ty=cy-(cy-W.ty)*(k/W.k); W.k=k; apply(); }

let dn=null; er.addEventListener("pointerdown",e=>{ if(e.target.closest(".ctl,.legend")) return; dn={x:e.clientX,y:e.clientY,tx:W.tx,ty:W.ty}; W.moved=false; er.classList.add("drag"); });

const FIX={

    <div class="intro prhow" style="background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px"><b>Cómo repetirlas</b>
