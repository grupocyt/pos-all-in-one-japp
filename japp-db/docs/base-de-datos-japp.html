mpaña, obra, festivo…)';\nCOMMENT ON COLUMN \"sales_target\".\"version\" IS 'Versión del registro';\n\n-- ───────────────────────── 4. Carta programada desde el Manager ─────────────────────────\n-- El Manager envía cartas completas o solo precios con fecha de entrada en vigor; la tienda las guarda y las aplica a su hora.\nCREATE TABLE IF NOT EXISTS \"catalog_release\" (\n  \"id\" UUID NOT NULL,\n  \"store_id\" UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"kind\" VARCHAR(20) NOT NULL CHECK (\"kind\" IN ('full','prices')),\n  \"release_version\" INTEGER NOT NULL,\n  \"effective_at\" TIMESTAMPTZ(3) NOT NULL,\n  \"status\" VARCHAR(20) NOT NULL DEFAULT 'pending' CHECK (\"status\" IN ('pending','applied','failed','superseded','cancelled')),\n  \"payload\" JSONB NOT NULL,\n  \"checksum\" CHAR(64) NOT NULL,\n  \"received_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"applied_at\" TIMESTAMPTZ(3),\n  \"error\" VARCHAR(300),\n  \"created_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  PRIMARY KEY (\"id\"),\n  CONSTRAINT \"uq_catalog_release_store_id_release_version\" UNIQUE (\"store_id\", \"release_version\")\n);\nCREATE INDEX IF NOT EXISTS \"ix_catalog_release_store_id_status_effective_at\" ON \"catalog_release\" (\"store_id\", \"status\", \"effective_at\");\nCREATE OR REPLACE TRIGGER \"trg_catalog_release_updated_at\" BEFORE UPDATE ON \"catalog_release\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"catalog_release\" IS 'Cartas enviadas por Japp Manager (completas o solo precios) con su fecha de entrada en vigor';\nCOMMENT ON COLUMN \"catalog_release\".\"id\" IS 'Id de la publicación en el Manager';\nCOMMENT ON COLUMN \"catalog_release\".\"store_id\" IS 'Local';\nCOMMENT ON COLUMN \"catalog_release\".\"kind\" IS 'full = carta completa (categorías, productos, preguntas, canales) · prices = solo PVP general/terraza';\nCOMMENT ON COLUMN \"catalog_release\".\"release_version\" IS 'Versión correlativa del Manager: una versión menor que la aplicada no se aplica';\nCOMMENT ON COLUMN \"catalog_release\".\"effective_at\" IS 'Cuándo entra en vigor (se aplica al abrir el primer periodo a partir de esa hora)';\nCOMMENT ON COLUMN \"catalog_release\".\"status\" IS 'pending · applied · failed · superseded (llegó otra más nueva) · cancelled (anulada desde el Manager)';\nCOMMENT ON COLUMN \"catalog_release\".\"payload\" IS 'Carta en JSON tal como la manda el Manager';\nCOMMENT ON COLUMN \"catalog_release\".\"checksum\" IS 'SHA-256 del payload: misma versión con otro contenido se rechaza';\nCOMMENT ON COLUMN \"catalog_release\".\"received_at\" IS 'Recibida';\nCOMMENT ON COLUMN \"catalog_release\".\"applied_at\" IS 'Aplicada';\nCOMMENT ON COLUMN \"catalog_release\".\"error\" IS 'Motivo del fallo al aplicar';\n\n\n-- 0006 · Canales de impresión por tipo (comanda / ticket), impresora por defecto, copias y ticket por área.\n-- Comanda: LINEA, CONTROL, BEBIDA… y sus copias (COPIA CONTROL imprime lo mismo que CONTROL en otra impresora, para locales con doble zona).\n-- Ticket: precuenta y factura salen por el canal de tickets del ÁREA de la mesa (terraza → impresora de terraza), sea cual sea el TPV o la PDA.\n\nALTER TABLE \"print_channel\" ADD COLUMN IF NOT EXISTS \"kind\" VARCHAR(20) NOT NULL DEFAULT 'kitchen';\nALTER TABLE \"print_channel\" ADD COLUMN IF NOT EXISTS \"printer_id\" UUID REFERENCES \"printer\" (\"id\");\nALTER TABLE \"print_channel\" ADD COLUMN IF NOT EXISTS \"copy_of_id\" UUID REFERENCES \"print_channel\" (\"id\");\nDO $$ BEGIN\n  ALTER TABLE \"print_channel\" ADD CONSTRAINT \"ck_print_channel_kind\" CHECK (\"kind\" IN ('kitchen','ticket'));\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\nDO $$ BEGIN\n  ALTER TABLE \"print_channel\" ADD CONSTRAINT \"ck_print_channel_copy_of_self\" CHECK (\"copy_of_id\" IS NULL OR \"copy_of_id\" <> \"id\");\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\nCREATE INDEX IF NOT EXISTS \"ix_print_channel_printer_id\" ON \"print_channel\" (\"printer_id\");\nCREATE INDEX IF NOT EXISTS \"ix_print_channel_copy_of_id\" ON \"print_channel\" (\"copy_of_id\");\nCOMMENT ON COLUMN \"print_channel\".\"kind\" IS 'kitchen = comanda (los productos salen por aquí) · ticket = precuenta y factura';\nCOMMENT ON COLUMN \"print_channel\".\"printer_id\" IS 'Impresora por defecto del canal (una estación puede cambiarla en station_channel_printer)';\nCOMMENT ON COLUMN \"print_channel\".\"copy_of_id\" IS 'Copia de otro canal de comanda: imprime lo mismo que ese canal en su propia impresora (doble zona)';\n\nALTER TABLE \"area\" ADD COLUMN IF NOT EXISTS \"ticket_channel_id\" UUID REFERENCES \"print_channel\" (\"id\");\nCREATE INDEX IF NOT EXISTS \"ix_area_ticket_channel_id\" ON \"area\" (\"ticket_channel_id\");\nCOMMENT ON COLUMN \"area\".\"ticket_channel_id\" IS 'Canal de tickets (precuenta y factura) de las mesas de esta área; NULL = el de la estación';\n\n-- Impresora por defecto de cada canal: la que ya tenía asignada alguna estación (la primera por nombre).\nUPDATE \"print_channel\" pc SET \"printer_id\" = x.printer_id\n  FROM (SELECT DISTINCT ON (scp.channel_id) scp.channel_id, scp.printer_id FROM \"station_channel_printer\" scp JOIN \"station\" s ON s.id = scp.station_id ORDER BY scp.channel_id, s.name) x\n WHERE pc.id = x.channel_id AND pc.\"printer_id\" IS NULL;\n\n-- Un canal TICKET por tienda (impresora de tipo ticket o, si no hay, la de barra / la primera) y las áreas apuntando a él.\nINSERT INTO \"print_channel\" (\"id\", \"store_id\", \"name\", \"active\", \"kind\", \"printer_id\")\nSELECT gen_random_uuid(), st.id, 'TICKET', true, 'ticket',\n       (SELECT p.id FROM \"printer\" p WHERE p.store_id = st.id AND p.active ORDER BY (p.kind = 'ticket') DESC, (p.kind = 'bar') DESC, p.name LIMIT 1)\n  FROM \"store\" st\n WHERE NOT EXISTS (SELECT 1 FROM \"print_channel\" c WHERE c.store_id = st.id AND c.kind = 'ticket');\nUPDATE \"area\" a SET \"ticket_channel_id\" = (SELECT c.id FROM \"print_channel\" c WHERE c.store_id = a.store_id AND c.kind = 'ticket' ORDER BY c.name LIMIT 1)\n WHERE a.\"ticket_channel_id\" IS NULL;\n\n\n-- 0007 · En qué momento se eliminó cada línea: pendiente de enviar, ya impresa (comanda) o en precuenta.\n-- Lo pide el Manager (quién eliminó «en línea, impreso o precuenta») y el informe de anulaciones.\nALTER TABLE \"order_line\" ADD COLUMN IF NOT EXISTS \"deleted_stage\" VARCHAR(20);\nDO $$ BEGIN\n  ALTER TABLE \"order_line\" ADD CONSTRAINT \"ck_order_line_deleted_stage\" CHECK (\"deleted_stage\" IS NULL OR \"deleted_stage\" IN ('pendingPrint','printed','preBill'));\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\nCOMMENT ON COLUMN \"order_line\".\"deleted_stage\" IS 'Estado de la línea cuando se eliminó: pendingPrint (sin enviar) · printed (comanda impresa) · preBill (en precuenta)';\n-- Líneas ya eliminadas: sin enviar si nunca se imprimió; impresa en otro caso (antes no se guardaba si estaba en precuenta).\nUPDATE \"order_line\" SET \"deleted_stage\" = CASE WHEN \"printed\" THEN 'printed' ELSE 'pendingPrint' END WHERE \"deleted\" AND \"deleted_stage\" IS NULL;\n\n\n-- 0008 · Reglas del 15/10/2026 y arreglos de la auditoría.\n--  1. Caja principal: una por tienda; el perfil Cajero solo entra en ella.\n--  2. Una persona por mesa: quién tiene la mesa, hasta cuándo, y si hay un cobro abierto. Solo entra en una mesa ocupada quien tenga mesas.entrarOcupada.\n--  3. Integridad de ventas: sin CASCADE, formas de pago libres (validadas por FK), una orden abierta por mesa, una factura por cuenta, cadena VeriFactu sin ramas.\n-- Pensada para tiendas con datos: cada paso es idempotente y no borra nada.\n\n-- 1 · Caja principal ---------------------------------------------------------------------------------------------\nALTER TABLE \"station\" ADD COLUMN IF NOT EXISTS \"is_main\" BOOLEAN NOT NULL DEFAULT false;\nCOMMENT ON COLUMN \"station\".\"is_main\" IS 'Caja principal de la tienda (solo una): caja, arqueo, retiros y cierre de periodo se hacen aquí';\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_station_main\" ON \"station\" (\"store_id\") WHERE \"is_main\";\n-- La primera estación de tipo caja de cada tienda que no tenga ninguna (en la Sucursal Pruebas, CAJA1).\nUPDATE \"station\" s SET \"is_main\" = true\n WHERE s.id = (SELECT x.id FROM \"station\" x WHERE x.store_id = s.store_id AND x.kind = 'station' AND x.active ORDER BY (x.name = 'CAJA1') DESC, x.name LIMIT 1)\n   AND NOT EXISTS (SELECT 1 FROM \"station\" y WHERE y.store_id = s.store_id AND y.is_main);\n\nALTER TABLE \"user_profile\" ADD COLUMN IF NOT EXISTS \"allowed_stations\" VARCHAR(10) NOT NULL DEFAULT 'any';\nDO $$ BEGIN\n  ALTER TABLE \"user_profile\" ADD CONSTRAINT \"ck_user_profile_allowed_stations\" CHECK (\"allowed_stations\" IN ('any','main'));\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\nCOMMENT ON COLUMN \"user_profile\".\"allowed_stations\" IS 'En qué equipos puede entrar el perfil: any = cualquiera · main = solo la caja principal (Cajero)';\nUPDATE \"user_profile\" SET \"allowed_stations\" = 'main' WHERE \"code\" = 'CAJERO' AND \"allowed_stations\" = 'any';\n\n-- 2 · Una persona por mesa -----------------------------------------------------------------------------------------\nALTER TABLE \"orders\" ADD COLUMN IF NOT EXISTS \"holder_user_id\" UUID REFERENCES \"app_user\" (\"id\");\nALTER TABLE \"orders\" ADD COLUMN IF NOT EXISTS \"holder_user_name\" VARCHAR(80);\nALTER TABLE \"orders\" ADD COLUMN IF NOT EXISTS \"holder_station_id\" UUID REFERENCES \"station\" (\"id\");\nALTER TABLE \"orders\" ADD COLUMN IF NOT EXISTS \"holder_station_name\" VARCHAR(60);\nALTER TABLE \"orders\" ADD COLUMN IF NOT EXISTS \"holder_until\" TIMESTAMPTZ(3);\nALTER TABLE \"orders\" ADD COLUMN IF NOT EXISTS \"charging_until\" TIMESTAMPTZ(3);\nCREATE INDEX IF NOT EXISTS \"ix_orders_holder_user_id\" ON \"orders\" (\"holder_user_id\");\nCREATE INDEX IF NOT EXISTS \"ix_orders_holder_station_id\" ON \"orders\" (\"holder_station_id\");\nCOMMENT ON COLUMN \"orders\".\"holder_user_id\" IS 'Quién tiene la mesa ahora (una persona por mesa); vale mientras holder_until > now()';\nCOMMENT ON COLUMN \"orders\".\"holder_user_name\" IS 'Nombre de quien tiene la mesa, para el aviso «Mesa ocupada por …»';\nCOMMENT ON COLUMN \"orders\".\"holder_station_id\" IS 'Equipo desde el que se tiene la mesa';\nCOMMENT ON COLUMN \"orders\".\"holder_station_name\" IS 'Nombre del equipo, para el aviso';\nCOMMENT ON COLUMN \"orders\".\"holder_until\" IS 'El equipo lo renueva cada 10 s; pasado este momento la mesa queda libre (equipo apagado o sin wifi)';\nCOMMENT ON COLUMN \"orders\".\"charging_until\" IS 'Cobro abierto en la mesa hasta este momento: nadie más entra, tampoco un administrador';\n\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\")\nVALUES ('mesas.entrarOcupada', 'Mesas', 'Entrar en una mesa ocupada por otro', 15)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\nSELECT p.id, 'mesas.entrarOcupada', p.store_id FROM \"user_profile\" p WHERE p.code IN ('ADMIN','ADMIN_LOCAL')\nON CONFLICT DO NOTHING;\n\n-- 3 · Integridad de ventas ------------------------------------------------------------------------------------------\n-- Formas de pago creadas en Ajustes (glovo, efectivo2…): el código ya no está en una lista fija; manda payment_method_id.\nALTER TABLE \"payment\" DROP CONSTRAINT IF EXISTS \"payment_method_check\";\nDO $$ BEGIN\n  ALTER TABLE \"payment\" ADD CONSTRAINT \"ck_payment_method_code\" CHECK (\"method\" ~ '^[a-z0-9_-]{1,30}$');\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\nUPDATE \"payment\" p SET \"payment_method_id\" = pm.id FROM \"payment_method\" pm\n WHERE p.\"payment_method_id\" IS NULL AND pm.store_id = p.store_id AND pm.code = p.method;\n\n-- Nada de ventas se borra en cascada.\nDO $$ DECLARE r record; BEGIN\n  FOR r IN SELECT c.conrelid::regclass AS tbl, c.conname, pg_get_constraintdef(c.oid) AS def\n             FROM pg_constraint c\n            WHERE c.contype = 'f' AND c.confdeltype = 'c'\n              AND c.conrelid::regclass::text IN ('account','order_event','order_line','order_line_modifier','order_line_printer','account_discount','payment','payment_cash_detail','payment_bank_data','invoice_tax')\n  LOOP\n    EXECUTE format('ALTER TABLE %s DROP CONSTRAINT %I', r.tbl, r.conname);\n    EXECUTE format('ALTER TABLE %s ADD CONSTRAINT %I %s', r.tbl, r.conname, replace(r.def, 'ON DELETE CASCADE', 'ON DELETE RESTRICT'));\n  END LOOP;\nEND $$;\n\n-- Una orden abierta por mesa.\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_orders_open_table\" ON \"orders\" (\"table_id\") WHERE \"status\" IN ('open','billing') AND \"table_id\" IS NOT NULL;\n\n-- Una factura F1/F2 emitida por cuenta.\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_invoice_account_issued\" ON \"invoice\" (\"account_id\") WHERE \"type\" IN ('F1','F2') AND \"status\" = 'issued' AND \"account_id\" IS NOT NULL;\n\n-- Cadena VeriFactu sin ramas: cada registro tiene como mucho un sucesor y hay un solo génesis por tienda.\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_verifactu_previous\" ON \"verifactu_record\" (\"previous_record_id\") WHERE \"previous_record_id\" IS NOT NULL;\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_verifactu_genesis\" ON \"verifactu_record\" (\"store_id\") WHERE \"previous_record_id\" IS NULL;\n\n-- Periodo: estado y marca de abierto coherentes.\nDO $$ BEGIN\n  ALTER TABLE \"sales_period\" ADD CONSTRAINT \"ck_sales_period_open_flag\" CHECK ((\"status\" = 'open') = (\"open_flag\" IS NOT NULL));\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\n\n-- Series de Ajustes › Facturación: siempre existen en invoice_series.\nINSERT INTO \"invoice_series\" (\"store_id\", \"series\", \"kind\")\nSELECT b.store_id, s.series, s.kind FROM \"billing_settings\" b\n CROSS JOIN LATERAL (VALUES (b.series_simplified, 'F2'), (b.series_full, 'F1'), (b.series_credit, 'R1')) AS s(series, kind)\nON CONFLICT DO NOTHING;\nDO $$ BEGIN\n  ALTER TABLE \"billing_settings\" ADD CONSTRAINT \"fk_billing_series_simplified\" FOREIGN KEY (\"store_id\", \"series_simplified\") REFERENCES \"invoice_series\" (\"store_id\", \"series\");\n  ALTER TABLE \"billing_settings\" ADD CONSTRAINT \"fk_billing_series_full\" FOREIGN KEY (\"store_id\", \"series_full\") REFERENCES \"invoice_series\" (\"store_id\", \"series\");\n  ALTER TABLE \"billing_settings\" ADD CONSTRAINT \"fk_billing_series_credit\" FOREIGN KEY (\"store_id\", \"series_credit\") REFERENCES \"invoice_series\" (\"store_id\", \"series\");\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\n\n-- Rangos que hasta ahora solo vigilaba el dominio.\nDO $$ BEGIN ALTER TABLE \"product\" ADD CONSTRAINT \"ck_product_price_nonneg\" CHECK (\"price\" >= 0 AND (\"price_terrace\" IS NULL OR \"price_terrace\" >= 0)); EXCEPTION WHEN duplicate_object THEN NULL; END $$;\nDO $$ BEGIN ALTER TABLE \"question\" ADD CONSTRAINT \"ck_question_answers_range\" CHECK (\"min_answers\" >= 0 AND \"min_answers\" <= \"max_answers\"); EXCEPTION WHEN duplicate_object THEN NULL; END $$;\nDO $$ BEGIN ALTER TABLE \"order_line\" ADD CONSTRAINT \"ck_order_line_quantity_pos\" CHECK (\"quantity\" > 0); EXCEPTION WHEN duplicate_object THEN NULL; END $$;\n\n-- Informe «top del mes» (CLAUDE.md).\nCREATE INDEX IF NOT EXISTS \"ix_order_line_store_created\" ON \"order_line\" (\"store_id\", \"created_by_at\");\n\n-- Idempotencia: la clave se reserva dentro de la transacción del comando (status_code 0 = en curso).\nCOMMENT ON TABLE \"idempotency_key\" IS 'Respuestas guardadas por Idempotency-Key: la misma clave devuelve la misma respuesta sin repetir la acción';\nCOMMENT ON COLUMN \"idempotency_key\".\"key\" IS 'Idempotency-Key que manda el equipo';\nCOMMENT ON COLUMN \"idempotency_key\".\"method\" IS 'Método HTTP de la petición original';\nCOMMENT ON COLUMN \"idempotency_key\".\"path\" IS 'Ruta de la petición original';\nCOMMENT ON COLUMN \"idempotency_key\".\"status_code\" IS 'Código HTTP guardado; 0 = la petición original sigue en curso';\nCOMMENT ON COLUMN \"idempotency_key\".\"response\" IS 'Cuerpo de la respuesta guardada';\n\n\n-- 0009 · Sesiones y bloqueo de PIN en la base (antes en memoria: al reiniciar la API los tokens sustituidos volvían a valer).\n--  1. app_session: una sesión vigente por usuario (la del último POST /sessions); un token vale solo si su jti es la vigente.\n--  2. pin_attempt: fallos de PIN por equipo (UUID del equipo si la estación lo tiene; si no, la estación) y hasta cuándo está bloqueado.\n-- Idempotente y sin tocar datos existentes.\n\n-- 1 · Sesiones ------------------------------------------------------------------------------------------------------\nCREATE TABLE IF NOT EXISTS \"app_session\" (\n  \"id\" UUID NOT NULL,\n  \"store_id\" UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"user_id\" UUID NOT NULL REFERENCES \"app_user\" (\"id\"),\n  \"station_id\" UUID REFERENCES \"station\" (\"id\"),\n  \"station_name\" VARCHAR(40) NOT NULL,\n  \"created_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"expires_at\" TIMESTAMPTZ(3) NOT NULL,\n  \"ended_at\" TIMESTAMPTZ(3),\n  \"ended_reason\" VARCHAR(20),\n  \"replaced_by_id\" UUID,\n  PRIMARY KEY (\"id\")\n);\nDO $$ BEGIN\n  ALTER TABLE \"app_session\" ADD CONSTRAINT \"ck_app_session_ended_reason\" CHECK (\"ended_reason\" IN ('replaced','logout'));\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\nDO $$ BEGIN\n  ALTER TABLE \"app_session\" ADD CONSTRAINT \"ck_app_session_ended\" CHECK ((\"ended_at\" IS NULL) = (\"ended_reason\" IS NULL));\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\n-- la nueva sesión se inserta después de cerrar la anterior en la misma transacción: FK diferida\nDO $$ BEGIN\n  ALTER TABLE \"app_session\" ADD CONSTRAINT \"fk_app_session_replaced_by\" FOREIGN KEY (\"replaced_by_id\") REFERENCES \"app_session\" (\"id\") DEFERRABLE INITIALLY DEFERRED;\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_app_session_current\" ON \"app_session\" (\"store_id\", \"user_id\") WHERE \"ended_at\" IS NULL;\nCREATE INDEX IF NOT EXISTS \"ix_app_session_user_id\" ON \"app_session\" (\"user_id\");\nCREATE INDEX IF NOT EXISTS \"ix_app_session_station_id\" ON \"app_session\" (\"station_id\");\nCREATE INDEX IF NOT EXISTS \"ix_app_session_replaced_by_id\" ON \"app_session\" (\"replaced_by_id\");\nCOMMENT ON TABLE \"app_session\" IS 'Sesiones de la API de tienda: una vigente por usuario (ended_at NULL). Un token solo vale si su jti es la vigente; si no, 401 SESSION_REPLACED';\nCOMMENT ON COLUMN \"app_session\".\"id\" IS 'jti del token de sesión';\nCOMMENT ON COLUMN \"app_session\".\"store_id\" IS 'Local al que pertenece';\nCOMMENT ON COLUMN \"app_session\".\"user_id\" IS 'Usuario que entró con su clave';\nCOMMENT ON COLUMN \"app_session\".\"station_id\" IS 'Equipo en el que entró';\nCOMMENT ON COLUMN \"app_session\".\"station_name\" IS 'Nombre del equipo, para el aviso «Tu clave se ha abierto en …»';\nCOMMENT ON COLUMN \"app_session\".\"created_at\" IS 'Cuándo entró';\nCOMMENT ON COLUMN \"app_session\".\"expires_at\" IS 'Caducidad del token (SESSION_HOURS)';\nCOMMENT ON COLUMN \"app_session\".\"ended_at\" IS 'Cuándo dejó de valer (NULL = vigente)';\nCOMMENT ON COLUMN \"app_session\".\"ended_reason\" IS 'replaced = entró de nuevo (en este u otro equipo) · logout = salió';\nCOMMENT ON COLUMN \"app_session\".\"replaced_by_id\" IS 'Sesión que la sustituyó';\n\n-- 2 · Bloqueo de PIN ------------------------------------------------------------------------------------------------\nCREATE TABLE IF NOT EXISTS \"pin_attempt\" (\n  \"store_id\" UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"key\" VARCHAR(80) NOT NULL,\n  \"failures\" SMALLINT NOT NULL DEFAULT 0,\n  \"locked_until\" TIMESTAMPTZ(3),\n  \"updated_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  PRIMARY KEY (\"store_id\", \"key\")\n);\nDO $$ BEGIN\n  ALTER TABLE \"pin_attempt\" ADD CONSTRAINT \"ck_pin_attempt_failures\" CHECK (\"failures\" >= 0);\nEXCEPTION WHEN duplicate_object THEN NULL; END $$;\nCREATE OR REPLACE TRIGGER \"trg_pin_attempt_updated_at\" BEFORE UPDATE ON \"pin_attempt\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"pin_attempt\" IS 'Fallos de PIN seguidos por equipo; tras store_parameters.pin_attempts queda bloqueado hasta locked_until';\nCOMMENT ON COLUMN \"pin_attempt\".\"store_id\" IS 'Local al que pertenece';\nCOMMENT ON COLUMN \"pin_attempt\".\"key\" IS 'device:<UUID del equipo> si la estación lo tiene; si no, station:<id>. user:<id> para la clave de encargado';\nCOMMENT ON COLUMN \"pin_attempt\".\"failures\" IS 'Fallos seguidos desde el último acierto o desbloqueo';\nCOMMENT ON COLUMN \"pin_attempt\".\"locked_until\" IS 'Teclado bloqueado hasta este momento (423 PIN_LOCKED)';\nCOMMENT ON COLUMN \"pin_attempt\".\"updated_at\" IS 'Último intento';\n\n\n-- 0010 · Tipos de factura de VeriFactu, índices de las series y comentarios que faltaban.\n--  1. invoice_series.kind, invoice.type y verifactu_record.invoice_type admiten los tipos que usa\n--     Ajustes › Facturación: F1, F2, F3 y R1…R5 (antes solo F1, F2 y R1: un abono R5 se rechazaba).\n--  2. Índice en cada clave foránea de billing_settings hacia invoice_series (PostgreSQL no las indexa solo).\n--  3. COMMENT ON en las columnas que se quedaron sin descripción.\n-- Idempotente y sin tocar datos existentes.\n\n-- 1 · Tipos de factura ------------------------------------------------------------------------------------------------\nALTER TABLE \"invoice_series\" DROP CONSTRAINT IF EXISTS \"invoice_series_kind_check\";\nALTER TABLE \"invoice_series\" ADD CONSTRAINT \"invoice_series_kind_check\"\n  CHECK (\"kind\" IN ('F1', 'F2', 'F3', 'R1', 'R2', 'R3', 'R4', 'R5'));\n\nALTER TABLE \"invoice\" DROP CONSTRAINT IF EXISTS \"invoice_type_check\";\nALTER TABLE \"invoice\" ADD CONSTRAINT \"invoice_type_check\"\n  CHECK (\"type\" IN ('F1', 'F2', 'F3', 'R1', 'R2', 'R3', 'R4', 'R5'));\n\nALTER TABLE \"verifactu_record\" DROP CONSTRAINT IF EXISTS \"verifactu_record_invoice_type_check\";\nALTER TABLE \"verifactu_record\" ADD CONSTRAINT \"verifactu_record_invoice_type_check\"\n  CHECK (\"invoice_type\" IN ('F1', 'F2', 'F3', 'R1', 'R2', 'R3', 'R4', 'R5'));\n\nCOMMENT ON COLUMN \"invoice_series\".\"kind\" IS\n  'Tipo VeriFactu: F1 completa, F2 simplificada, F3 sustitutiva, R1…R5 rectificativas (R5 = abono de simplificada)';\nCOMMENT ON COLUMN \"invoice\".\"type\" IS\n  'Tipo VeriFactu: F1 completa, F2 simplificada, F3 sustitutiva, R1…R5 rectificativas (R5 = abono de simplificada)';\n\n-- 2 · Índices de las claves foráneas de billing_settings --------------------------------------------------------------\nCREATE INDEX IF NOT EXISTS \"ix_billing_settings_series_simplified\" ON \"billing_settings\" (\"store_id\", \"series_simplified\");\nCREATE INDEX IF NOT EXISTS \"ix_billing_settings_series_full\" ON \"billing_settings\" (\"store_id\", \"series_full\");\nCREATE INDEX IF NOT EXISTS \"ix_billing_settings_series_credit\" ON \"billing_settings\" (\"store_id\", \"series_credit\");\n\n-- 3 · Comentarios que faltaban ----------------------------------------------------------------------------------------\nCOMMENT ON COLUMN \"idempotency_key\".\"store_id\" IS 'Local al que pertenece';\nCOMMENT ON COLUMN \"idempotency_key\".\"created_at\" IS 'Cuándo llegó la petición original (las claves caducan a las 24 h)';\nCOMMENT ON COLUMN \"sync_state\".\"created_at\" IS 'Cuándo se creó';\nCOMMENT ON COLUMN \"sync_state\".\"updated_at\" IS 'Último cambio (lo pone el disparador)';\nCOMMENT ON COLUMN \"catalog_release\".\"created_at\" IS 'Cuándo se creó';\nCOMMENT ON COLUMN \"catalog_release\".\"updated_at\" IS 'Último cambio (lo pone el disparador)';\nCOMMENT ON COLUMN \"sales_target\".\"created_at\" IS 'Cuándo se creó';\nCOMMENT ON COLUMN \"sales_target\".\"updated_at\" IS 'Último cambio (lo pone el disparador)';\n\n\n-- 0011 · Un UUID de equipo, una sola estación.\n-- El TPV y la PDA se reconocen por su UUID al arrancar (POST /devices/identify): si dos estaciones activas\n-- de la misma tienda tuvieran el mismo UUID, no se sabría cuál es. Vacío o NULL = sin equipo asignado.\n-- Idempotente y sin tocar datos existentes (si hubiera repetidos, la migración falla y hay que resolverlos antes).\n\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_station_device_uuid\" ON \"station\" (\"store_id\", lower(\"device_uuid\"))\n  WHERE \"active\" AND \"device_uuid\" IS NOT NULL AND \"device_uuid\" <> '';\n\nCOMMENT ON COLUMN \"station\".\"device_uuid\" IS\n  'UUID del equipo (TPV o PDA) con el que se reconoce al arrancar; único entre las estaciones activas de la tienda';\n\n\n-- 0012 · Carta desde el App Manager, Order on Table y equipos.\n--  1. category, product y question llevan «external_id» (el id del App Manager): los servicios de sync\n--     (POST /config/carta/sync, /config/categorias/sync…) casan por él, y si vuelve uno quitado se reactiva\n--     con su mismo id. Productos con descripción (se imprime) y categorías/productos con «order_on_table».\n--  2. store.web_order_url: URL base del sistema de Order on Table (QR = web_order_url + /t/ + token).\n--  3. oot_token: un token por orden abierta; caduca al cerrar la mesa (revoked_at) o al anularlo.\n--  4. Permiso mesas.orderOnTable (generar y anular el QR), concedido a ADMIN y ADMIN_LOCAL.\n--  5. invoice_credit_line: qué unidades de cada línea abona cada rectificativa (abono parcial por líneas).\n--  6. Transacción completa en la cola de sincronización: un índice para quedarse con la última de cada orden.\n-- Idempotente y sin tocar datos existentes.\n\n-- 1 · Carta del App Manager ------------------------------------------------------------------------------------------\nALTER TABLE \"category\" ADD COLUMN IF NOT EXISTS \"external_id\" VARCHAR(60);\nALTER TABLE \"category\" ADD COLUMN IF NOT EXISTS \"order_on_table\" BOOLEAN NOT NULL DEFAULT TRUE;\nALTER TABLE \"product\" ADD COLUMN IF NOT EXISTS \"external_id\" VARCHAR(60);\nALTER TABLE \"product\" ADD COLUMN IF NOT EXISTS \"description\" VARCHAR(300);\nALTER TABLE \"product\" ADD COLUMN IF NOT EXISTS \"order_on_table\" BOOLEAN NOT NULL DEFAULT TRUE;\nALTER TABLE \"question\" ADD COLUMN IF NOT EXISTS \"external_id\" VARCHAR(60);\n\n-- Un external_id por tienda (también entre registros desactivados: así se reactiva el mismo).\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_category_external_id\" ON \"category\" (\"store_id\", \"external_id\")\n  WHERE \"external_id\" IS NOT NULL;\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_product_external_id\" ON \"product\" (\"store_id\", \"external_id\")\n  WHERE \"external_id\" IS NOT NULL;\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_question_external_id\" ON \"question\" (\"store_id\", \"external_id\")\n  WHERE \"external_id\" IS NOT NULL;\n\nCOMMENT ON COLUMN \"category\".\"external_id\" IS 'Id en el App Manager (casa los servicios de sync); único por tienda';\nCOMMENT ON COLUMN \"category\".\"order_on_table\" IS 'Sale en la carta de Order on Table';\nCOMMENT ON COLUMN \"product\".\"external_id\" IS 'Id en el App Manager (casa los servicios de sync); único por tienda';\nCOMMENT ON COLUMN \"product\".\"description\" IS 'Descripción: se imprime debajo del producto en MAYÚSCULAS (una línea por salto)';\nCOMMENT ON COLUMN \"product\".\"order_on_table\" IS 'Se puede pedir desde Order on Table (además de su categoría)';\nCOMMENT ON COLUMN \"question\".\"external_id\" IS 'Id en el App Manager (casa los servicios de sync); único por tienda';\n\n-- 2 · URL de Order on Table -------------------------------------------------------------------------------------------\nALTER TABLE \"store\" ADD COLUMN IF NOT EXISTS \"web_order_url\" VARCHAR(300);\nCOMMENT ON COLUMN \"store\".\"web_order_url\" IS 'URL base de Order on Table; el QR de la mesa es esta URL + /t/ + token';\n\n-- 3 · Tokens de Order on Table ----------------------------------------------------------------------------------------\nCREATE TABLE IF NOT EXISTS \"oot_token\" (\n  \"id\" UUID NOT NULL DEFAULT gen_random_uuid(),\n  \"store_id\" UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"order_id\" UUID NOT NULL REFERENCES \"orders\" (\"id\"),\n  \"token\" VARCHAR(60) NOT NULL,\n  \"created_by_user_id\" UUID REFERENCES \"app_user\" (\"id\"),\n  \"created_by_user_name\" VARCHAR(60),\n  \"created_by_device\" VARCHAR(40),\n  \"created_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"revoked_at\" TIMESTAMPTZ(3),\n  \"revoked_reason\" VARCHAR(30) CHECK (\"revoked_reason\" IN ('manual', 'closed', 'transferred')),\n  PRIMARY KEY (\"id\"),\n  CONSTRAINT \"uq_oot_token_token\" UNIQUE (\"token\")\n);\n-- Un token vigente por orden: generar otra vez devuelve el mismo.\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_oot_token_order_live\" ON \"oot_token\" (\"order_id\") WHERE \"revoked_at\" IS NULL;\nCREATE INDEX IF NOT EXISTS \"ix_oot_token_store_id\" ON \"oot_token\" (\"store_id\");\nCREATE INDEX IF NOT EXISTS \"ix_oot_token_created_by_user_id\" ON \"oot_token\" (\"created_by_user_id\");\nCOMMENT ON TABLE \"oot_token\" IS 'Token del QR de Order on Table de una orden abierta (caduca al cerrar la mesa)';\nCOMMENT ON COLUMN \"oot_token\".\"id\" IS 'Identificador';\nCOMMENT ON COLUMN \"oot_token\".\"store_id\" IS 'Local al que pertenece';\nCOMMENT ON COLUMN \"oot_token\".\"order_id\" IS 'Orden (mesa) a la que pide el cliente';\nCOMMENT ON COLUMN \"oot_token\".\"token\" IS 'Token opaco del QR (oot_ + 32 caracteres aleatorios)';\nCOMMENT ON COLUMN \"oot_token\".\"created_by_user_id\" IS 'Quién lo generó';\nCOMMENT ON COLUMN \"oot_token\".\"created_by_user_name\" IS 'Nombre de quién lo generó';\nCOMMENT ON COLUMN \"oot_token\".\"created_by_device\" IS 'Equipo desde el que se generó';\nCOMMENT ON COLUMN \"oot_token\".\"created_at\" IS 'Cuándo se generó';\nCOMMENT ON COLUMN \"oot_token\".\"revoked_at\" IS 'Cuándo dejó de valer (NULL = vigente)';\nCOMMENT ON COLUMN \"oot_token\".\"revoked_reason\" IS 'manual (anulado), closed (mesa cerrada) o transferred (mesa cambiada)';\n\n-- 4 · Permiso ---------------------------------------------------------------------------------------------------------\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\")\nVALUES ('mesas.orderOnTable', 'Mesas', 'Order on Table (QR de la mesa)', 16)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\nSELECT p.id, 'mesas.orderOnTable', p.store_id FROM \"user_profile\" p WHERE p.code IN ('ADMIN', 'ADMIN_LOCAL')\nON CONFLICT DO NOTHING;\n\n-- 5 · Abonos por líneas ---------------------------------------------------------------------------------------------\n-- Una rectificativa puede abonar solo algunas unidades; aquí queda cuánto de cada línea, para no abonar dos veces.\nCREATE TABLE IF NOT EXISTS \"invoice_credit_line\" (\n  \"id\" UUID NOT NULL DEFAULT gen_random_uuid(),\n  \"store_id\" UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"credit_invoice_id\" UUID NOT NULL REFERENCES \"invoice\" (\"id\"),\n  \"rectified_invoice_id\" UUID NOT NULL REFERENCES \"invoice\" (\"id\"),\n  \"order_line_id\" UUID NOT NULL REFERENCES \"order_line\" (\"id\"),\n  \"quantity\" NUMERIC(9,3) NOT NULL CHECK (\"quantity\" > 0),\n  \"amount\" NUMERIC(10,2) NOT NULL CHECK (\"amount\" >= 0),\n  \"tax_rate\" NUMERIC(5,2) NOT NULL,\n  PRIMARY KEY (\"id\"),\n  CONSTRAINT \"uq_invoice_credit_line\" UNIQUE (\"credit_invoice_id\", \"order_line_id\")\n);\nCREATE INDEX IF NOT EXISTS \"ix_invoice_credit_line_rectified\" ON \"invoice_credit_line\" (\"rectified_invoice_id\", \"order_line_id\");\nCREATE INDEX IF NOT EXISTS \"ix_invoice_credit_line_order_line_id\" ON \"invoice_credit_line\" (\"order_line_id\");\nCREATE INDEX IF NOT EXISTS \"ix_invoice_credit_line_store_id\" ON \"invoice_credit_line\" (\"store_id\");\nCOMMENT ON TABLE \"invoice_credit_line\" IS 'Unidades de cada línea que abona una rectificativa (abono total o parcial)';\nCOMMENT ON COLUMN \"invoice_credit_line\".\"id\" IS 'Identificador';\nCOMMENT ON COLUMN \"invoice_credit_line\".\"store_id\" IS 'Local al que pertenece';\nCOMMENT ON COLUMN \"invoice_credit_line\".\"credit_invoice_id\" IS 'Rectificativa (R1 o R5)';\nCOMMENT ON COLUMN \"invoice_credit_line\".\"rectified_invoice_id\" IS 'Factura que se abona';\nCOMMENT ON COLUMN \"invoice_credit_line\".\"order_line_id\" IS 'Línea vendida que se abona';\nCOMMENT ON COLUMN \"invoice_credit_line\".\"quantity\" IS 'Unidades abonadas';\nCOMMENT ON COLUMN \"invoice_credit_line\".\"amount\" IS 'Importe abonado con IVA (en positivo; la rectificativa lleva el total en negativo)';\nCOMMENT ON COLUMN \"invoice_credit_line\".\"tax_rate\" IS 'Tipo de IVA de la línea';\n\n-- 6 · Cola de sincronización ------------------------------------------------------------------------------------------\n-- El agente manda solo la última transacción de cada orden pendiente: este índice la encuentra sin recorrer la cola.\nCREATE INDEX IF NOT EXISTS \"ix_sync_outbox_entity_pending\" ON \"sync_outbox\" (\"store_id\", \"entity\", \"entity_id\", \"id\")\n  WHERE \"sent_at\" IS NULL AND \"parked_at\" IS NULL;\n\n\n-- 0013 · Aviso al agente de sincronización en cuanto entra algo en la cola.\n-- El agente (apps/sync-agent) hace LISTEN sync_outbox: así una mesa cobrada llega al Manager al momento y no espera a su ciclo.\n-- Un aviso por sentencia (no por fila): un cambio de mesa que encola dos órdenes despierta al agente una sola vez.\n-- pg_notify se entrega al hacer COMMIT; si la transacción se deshace, no se avisa.\nCREATE OR REPLACE FUNCTION notify_sync_outbox() RETURNS trigger\nLANGUAGE plpgsql AS $$\nBEGIN\n  PERFORM pg_notify('sync_outbox', '');\n  RETURN NULL;\nEND $$;\nCOMMENT ON FUNCTION notify_sync_outbox() IS 'Despierta al agente de sincronización (LISTEN sync_outbox) tras encolar';\n\nDROP TRIGGER IF EXISTS \"trg_sync_outbox_notify\" ON \"sync_outbox\";\nCREATE TRIGGER \"trg_sync_outbox_notify\" AFTER INSERT ON \"sync_outbox\"\n  FOR EACH STATEMENT EXECUTE FUNCTION notify_sync_outbox();\n\n\n-- 0014 · Id de integración en las formas de pago (24/10/2026).\n-- Igual que category/product/question (0012): «external_id» es el id con el que otro sistema (Manager, contabilidad…)\n-- reconoce la forma de pago. Opcional y sin repetir dentro de la tienda (también entre desactivadas).\nALTER TABLE \"payment_method\" ADD COLUMN IF NOT EXISTS \"external_id\" VARCHAR(60);\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_payment_method_external_id\" ON \"payment_method\" (\"store_id\", \"external_id\")\n  WHERE \"external_id\" IS NOT NULL;\nCOMMENT ON COLUMN \"payment_method\".\"external_id\" IS 'Id de integración: con él otro sistema (Manager, contabilidad) reconoce la forma de pago. Único por tienda';\n\n\n-- 0015 · Incidencias de mesa (25/10/2026).\n-- Cuando un equipo pierde la conexión, ve que la mesa no cuadra con el servidor o el servidor le rechaza un cambio,\n-- guarda aquí la incidencia SIN aplicar nada: los cambios pendientes, las diferencias o el error, quién, equipo y hora.\n-- Lo que se hace después (reintentar el envío o quedarse con lo del servidor) lo decide una persona en ese equipo.\n-- order_id y account_id no llevan FK: una mesa abierta sin conexión puede no existir aún en el servidor.\nCREATE TABLE IF NOT EXISTS \"order_incident\" (\n  \"id\"                     UUID PRIMARY KEY,\n  \"store_id\"               UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"order_id\"               UUID,\n  \"account_id\"             UUID,\n  \"table_name\"             VARCHAR(20) NOT NULL,\n  \"kind\"                   VARCHAR(20) NOT NULL CHECK (\"kind\" IN ('offline', 'mismatch', 'rejected')),\n  \"status\"                 VARCHAR(20) NOT NULL DEFAULT 'open' CHECK (\"status\" IN ('open', 'retried', 'discarded', 'resolved')),\n  \"detail\"                 JSONB NOT NULL DEFAULT '{}'::jsonb,\n  \"station_id\"             UUID,\n  \"device\"                 VARCHAR(60),\n  \"occurred_at\"            TIMESTAMPTZ(3) NOT NULL,\n  \"opened_by_user_id\"      UUID,\n  \"opened_by_user_name\"    VARCHAR(80) NOT NULL,\n  \"opened_by_at\"           TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"resolved_by_user_id\"    UUID,\n  \"resolved_by_user_name\"  VARCHAR(80),\n  \"resolved_authorized_by\" VARCHAR(80),\n  \"resolved_by_at\"         TIMESTAMPTZ(3),\n  \"resolution_note\"        VARCHAR(200),\n  \"created_at\"             TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_at\"             TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"version\"                INTEGER NOT NULL DEFAULT 1,\n  CONSTRAINT \"ck_order_incident_resolved\" CHECK ((\"status\" = 'open') = (\"resolved_by_at\" IS NULL))\n);\nCREATE INDEX IF NOT EXISTS \"ix_order_incident_store_id\" ON \"order_incident\" (\"store_id\", \"status\", \"opened_by_at\" DESC);\nCREATE INDEX IF NOT EXISTS \"ix_order_incident_order_id\" ON \"order_incident\" (\"store_id\", \"order_id\");\nDROP TRIGGER IF EXISTS \"trg_order_incident_updated_at\" ON \"order_incident\";\nCREATE TRIGGER \"trg_order_incident_updated_at\" BEFORE UPDATE ON \"order_incident\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"order_incident\" IS 'Incidencias de mesa: sin conexión, no cuadra con el servidor o cambio rechazado. Se guardan solas; resolverlas lo decide una persona en el equipo donde pasó';\nCOMMENT ON COLUMN \"order_incident\".\"id\" IS 'Lo genera el equipo: repetir el envío no duplica la incidencia';\nCOMMENT ON COLUMN \"order_incident\".\"order_id\" IS 'Orden de la mesa (sin FK: puede no existir aún en el servidor si se abrió sin conexión)';\nCOMMENT ON COLUMN \"order_incident\".\"kind\" IS 'offline (cambios que se quedaron en el equipo), mismatch (pantalla y servidor no coinciden) o rejected (el servidor no aceptó un cambio)';\nCOMMENT ON COLUMN \"order_incident\".\"status\" IS 'open; retried (se reintentó el envío), discarded (se quedó lo del servidor) o resolved (volvió a cuadrar sola)';\nCOMMENT ON COLUMN \"order_incident\".\"detail\" IS 'Cambios pendientes, diferencias o error, tal como los vio el equipo';\nCOMMENT ON COLUMN \"order_incident\".\"device\" IS 'Nombre del equipo donde pasó';\nCOMMENT ON COLUMN \"order_incident\".\"occurred_at\" IS 'Hora del equipo en que pasó (puede ser anterior a opened_by_at si estuvo sin conexión)';\nCOMMENT ON COLUMN \"order_incident\".\"resolved_authorized_by\" IS 'Encargado que autorizó la resolución, si hizo falta';\n\n\n-- 0016 · Tiempo de la tanda (25/10/2026).\n-- El TPV y la PDA guardan en el equipo lo que se marca y lo mandan al servidor en una tanda (POST /orders/{id}/batch)\n-- cuando pasan estos segundos sin tocar. Se ajusta en Ajustes › Facturación; entre 2 y 30 s, 5 por defecto.\nALTER TABLE \"billing_settings\" ADD COLUMN IF NOT EXISTS \"batch_send_seconds\" SMALLINT NOT NULL DEFAULT 5;\nALTER TABLE \"billing_settings\" DROP CONSTRAINT IF EXISTS \"ck_billing_settings_batch_send_seconds\";\nALTER TABLE \"billing_settings\" ADD CONSTRAINT \"ck_billing_settings_batch_send_seconds\" CHECK (\"batch_send_seconds\" BETWEEN 2 AND 30);\nCOMMENT ON COLUMN \"billing_settings\".\"batch_send_seconds\" IS 'Segundos sin tocar tras los que el TPV y la PDA mandan al servidor la tanda de cambios de la mesa (2–30, 5 por defecto)';\n\n\n-- 0017 · SLA de atención por mesa (25/10/2026).\n-- Gestiones › Mesas en servicio mide, en vivo, cómo se atiende cada mesa abierta y lo compara con estos límites\n-- (Ajustes › SLA de atención). Se mide solo con lo que la base ya guarda: apertura, cuándo se marca cada línea,\n-- cuándo se envía a cocina, la precuenta y el cobro.\n--   first_order_minutes  de abrir la mesa a marcar lo primero (la toma de nota)\n--   unsent_minutes       algo marcado que lleva este tiempo sin enviarse a cocina\n--   idle_minutes         desde el último envío a cocina sin volver a la mesa (antes de la precuenta)\n--   prebill_pay_minutes  de la precuenta al cobro\n--   total_minutes        la mesa abierta en total\n-- Los límites van por tienda, zona o mesa, y cada uno para todos los turnos o para uno: manda la regla más concreta\n-- (mesa+turno > mesa > zona+turno > zona > tienda+turno > tienda) y lo que una regla deja vacío lo hereda de la siguiente.\n\nCREATE TABLE IF NOT EXISTS \"service_shift\" (\n  \"id\"          UUID PRIMARY KEY,\n  \"store_id\"    UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"name\"        VARCHAR(40) NOT NULL,\n  \"starts_at\"   TIME(0) NOT NULL,\n  \"ends_at\"     TIME(0) NOT NULL,\n  \"sort_order\"  SMALLINT NOT NULL DEFAULT 1,\n  \"created_at\"  TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_at\"  TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  CONSTRAINT \"ck_service_shift_span\" CHECK (\"starts_at\" <> \"ends_at\"),\n  CONSTRAINT \"uq_service_shift_store_id_name\" UNIQUE (\"store_id\", \"name\")\n);\nDROP TRIGGER IF EXISTS \"trg_service_shift_updated_at\" ON \"service_shift\";\nCREATE TRIGGER \"trg_service_shift_updated_at\" BEFORE UPDATE ON \"service_shift\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"service_shift\" IS 'Turnos de servicio para los SLA de atención (p. ej. Comida 12:00–16:30, Cena 19:30–00:30). La mesa cuenta en el turno en que se abrió';\nCOMMENT ON COLUMN \"service_shift\".\"ends_at\" IS 'Si es menor que starts_at, el turno pasa de medianoche';\n\nCREATE TABLE IF NOT EXISTS \"service_sla\" (\n  \"id\"                   UUID PRIMARY KEY,\n  \"store_id\"             UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"area_id\"              UUID REFERENCES \"area\" (\"id\") ON DELETE CASCADE,\n  \"table_id\"             UUID REFERENCES \"dining_table\" (\"id\") ON DELETE CASCADE,\n  \"shift_id\"             UUID REFERENCES \"service_shift\" (\"id\") ON DELETE CASCADE,\n  \"first_order_minutes\"  SMALLINT,\n  \"unsent_minutes\"       SMALLINT,\n  \"idle_minutes\"         SMALLINT,\n  \"prebill_pay_minutes\"  SMALLINT,\n  \"total_minutes\"        SMALLINT,\n  \"warn_percent\"         SMALLINT,\n  \"version\"              INTEGER NOT NULL DEFAULT 1,\n  \"created_at\"           TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_at\"           TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  CONSTRAINT \"ck_service_sla_scope\" CHECK (\"area_id\" IS NULL OR \"table_id\" IS NULL),\n  CONSTRAINT \"ck_service_sla_minutes\" CHECK (\n    COALESCE(\"first_order_minutes\", 1) BETWEEN 1 AND 600 AND COALESCE(\"unsent_minutes\", 1) BETWEEN 1 AND 600 AND\n    COALESCE(\"idle_minutes\", 1) BETWEEN 1 AND 600 AND COALESCE(\"prebill_pay_minutes\", 1) BETWEEN 1 AND 600 AND\n    COALESCE(\"total_minutes\", 1) BETWEEN 1 AND 600),\n  CONSTRAINT \"ck_service_sla_warn_percent\" CHECK (COALESCE(\"warn_percent\", 80) BETWEEN 50 AND 99),\n  CONSTRAINT \"ck_service_sla_store_default\" CHECK (\n    \"area_id\" IS NOT NULL OR \"table_id\" IS NOT NULL OR \"shift_id\" IS NOT NULL OR (\n      \"first_order_minutes\" IS NOT NULL AND \"unsent_minutes\" IS NOT NULL AND \"idle_minutes\" IS NOT NULL AND\n      \"prebill_pay_minutes\" IS NOT NULL AND \"total_minutes\" IS NOT NULL AND \"warn_percent\" IS NOT NULL))\n);\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_service_sla_scope\" ON \"service_sla\" (\"store_id\",\n  COALESCE(\"area_id\", '00000000-0000-0000-0000-000000000000'::uuid),\n  COALESCE(\"table_id\", '00000000-0000-0000-0000-000000000000'::uuid),\n  COALESCE(\"shift_id\", '00000000-0000-0000-0000-000000000000'::uuid));\nCREATE INDEX IF NOT EXISTS \"ix_service_sla_store_id\" ON \"service_sla\" (\"store_id\");\nCREATE INDEX IF NOT EXISTS \"ix_service_sla_area_id\" ON \"service_sla\" (\"area_id\");\nCREATE INDEX IF NOT EXISTS \"ix_service_sla_table_id\" ON \"service_sla\" (\"table_id\");\nCREATE INDEX IF NOT EXISTS \"ix_service_sla_shift_id\" ON \"service_sla\" (\"shift_id\");\nDROP TRIGGER IF EXISTS \"trg_service_sla_updated_at\" ON \"service_sla\";\nCREATE TRIGGER \"trg_service_sla_updated_at\" BEFORE UPDATE ON \"service_sla\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"service_sla\" IS 'SLA de atención: minutos máximos de cada paso de la mesa por tienda, zona o mesa y turno. Vacío = hereda de la regla menos concreta';\nCOMMENT ON COLUMN \"service_sla\".\"first_order_minutes\" IS 'De abrir la mesa a marcar lo primero';\nCOMMENT ON COLUMN \"service_sla\".\"unsent_minutes\" IS 'Algo marcado sin enviar a cocina durante más de esto';\nCOMMENT ON COLUMN \"service_sla\".\"idle_minutes\" IS 'Desde el último envío a cocina sin volver a la mesa (antes de la precuenta)';\nCOMMENT ON COLUMN \"service_sla\".\"prebill_pay_minutes\" IS 'De la precuenta al cobro';\nCOMMENT ON COLUMN \"service_sla\".\"total_minutes\" IS 'La mesa abierta en total';\nCOMMENT ON COLUMN \"service_sla\".\"warn_percent\" IS 'A partir de este % del límite la mesa se pinta en ámbar (50–99)';\nCOMMENT ON COLUMN \"service_sla\".\"version\" IS 'Solo en la regla de la tienda: sube con cada cambio de la configuración de SLA (control de concurrencia)';\n\n-- La regla de la tienda, para las tiendas que ya existen (los dos tiempos que ya había en Parámetros pasan aquí).\nINSERT INTO \"service_sla\" (\"id\", \"store_id\", \"first_order_minutes\", \"unsent_minutes\", \"idle_minutes\", \"prebill_pay_minutes\", \"total_minutes\", \"warn_percent\")\nSELECT gen_random_uuid(), s.\"id\", 10, 3, LEAST(GREATEST(COALESCE(p.\"idle_table_minutes\", 30), 1), 600),\n       LEAST(GREATEST(COALESCE(p.\"prebill_to_pay_minutes\", 6), 1), 600), 120, 80\nFROM \"store\" s LEFT JOIN \"store_parameters\" p ON p.\"store_id\" = s.\"id\"\nWHERE NOT EXISTS (SELECT 1 FROM \"service_sla\" x WHERE x.\"store_id\" = s.\"id\" AND x.\"area_id\" IS NULL AND x.\"table_id\" IS NULL AND x.\"shift_id\" IS NULL);\n\n\n-- 0018 · Color de cada usuario (25/10/2026).\n-- En el TPV y la PDA, lo que marcó cada persona lleva una etiqueta con su nombre en su color; se elige en\n-- Ajustes › Usuarios. Vacío = el TPV le da uno de la paleta según el nombre.\nALTER TABLE \"app_user\" ADD COLUMN IF NOT EXISTS \"color\" VARCHAR(7);\nALTER TABLE \"app_user\" DROP CONSTRAINT IF EXISTS \"ck_app_user_color\";\nALTER TABLE \"app_user\" ADD CONSTRAINT \"ck_app_user_color\" CHECK (\"color\" IS NULL OR \"color\" ~ '^#[0-9A-Fa-f]{6}$');\nCOMMENT ON COLUMN \"app_user\".\"color\" IS 'Color de la persona en el TPV (#RRGGBB): etiqueta de lo que marcó y su nombre en las mesas. NULL = automático';\n\n\n-- 0019 · URL de la interfaz de ventas al SIR (25/10/2026).\n-- Al cerrar el periodo, el TPV consulta lo que se manda al SIR (Sistema Integrado de Restaurantes) y lo puede enviar\n-- (SOAP interfaceVentasAgregadores) a esta URL. El código del restaurante en el SIR es store.maxpoint_rst_id (IdIntegración).\nALTER TABLE \"store\" ADD COLUMN IF NOT EXISTS \"sir_url\" VARCHAR(300);\nALTER TABLE \"store\" DROP CONSTRAINT IF EXISTS \"ck_store_sir_url\";\nALTER TABLE \"store\" ADD CONSTRAINT \"ck_store_sir_url\" CHECK (\"sir_url\" IS NULL OR \"sir_url\" ~* '^https?://');\nCOMMENT ON COLUMN \"store\".\"sir_url\" IS 'URL del servicio SOAP de la interfaz de ventas al SIR (interfaceVentasAgregadores). NULL = sin configurar';\nCOMMENT ON COLUMN \"store\".\"maxpoint_rst_id\" IS 'Código del restaurante en MaxPoint y en el SIR (cod_restaurante; Ajustes › Restaurante › IdIntegración)';\n\n\n-- 0020 · Formas de pago que no se ven en el TPV y tipo «descuento» (25/10/2026).\n-- Para la interfaz de ventas al SIR, los descuentos son una forma de pago más (su id de integración es el Cod_FormaPago\n-- con el que el SIR los recibe, p. ej. 63), pero no se cobra con ella: se marca «no mostrar en el TPV».\nALTER TABLE \"payment_method\" ADD COLUMN IF NOT EXISTS \"show_in_tpv\" BOOLEAN NOT NULL DEFAULT TRUE;\nCOMMENT ON COLUMN \"payment_method\".\"show_in_tpv\" IS 'Se ve en el cobro del TPV y la PDA. FALSE = solo para integraciones (p. ej. descuentos en el SIR)';\nALTER TABLE \"payment_method\" DROP CONSTRAINT IF EXISTS \"payment_method_kind_check\";\nALTER TABLE \"payment_method\" DROP CONSTRAINT IF EXISTS \"ck_payment_method_kind\";\nALTER TABLE \"payment_method\" ADD CONSTRAINT \"ck_payment_method_kind\" CHECK (\"kind\" IN ('cash','card','platform','voucher','discount'));\nCOMMENT ON COLUMN \"payment_method\".\"kind\" IS 'Tipo: cash, card, platform, voucher o discount (descuentos para el SIR; no se cobra con ella)';\n\n\n-- 0021 · Segunda pantalla del cliente (25/10/2026): Ajustes › Restaurante › Banners.\n-- customer_display: una fila por tienda con la configuración (tipo, textos, color, opciones de ticket, reproducción) y su versión.\n-- display_media: los vídeos e imágenes de la lista con su horario. El archivo va en disco, en MEDIA_DIR del servidor\n-- (<MEDIA_DIR>/<id>); aquí quedan sus datos, su huella sha256 y el orden. Quitar uno lo marca deleted_at (no se borra la fila).\nCREATE TABLE IF NOT EXISTS \"customer_display\" (\n  \"store_id\" UUID PRIMARY KEY REFERENCES \"store\"(\"id\"),\n  \"config\" JSONB NOT NULL DEFAULT '{}'::jsonb,\n  \"version\" INTEGER NOT NULL DEFAULT 1 CHECK (\"version\" > 0),\n  \"updated_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_by\" VARCHAR(80),\n  CONSTRAINT \"ck_customer_display_config\" CHECK (jsonb_typeof(\"config\") = 'object')\n);\nDROP TRIGGER IF EXISTS \"trg_customer_display_updated_at\" ON \"customer_display\";\nCREATE TRIGGER \"trg_customer_display_updated_at\" BEFORE UPDATE ON \"customer_display\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"customer_display\" IS 'Segunda pantalla del cliente: configuración por tienda (Ajustes › Restaurante › Banners)';\nCOMMENT ON COLUMN \"customer_display\".\"config\" IS 'mode (off|billing|billing_banner|banner; los banners solo en fast food), greeting, name, color, farewell, reviewUrl, sideTitle, tickets{email,print,invoice,none}, loop, muted, imageSeconds';\n\nCREATE TABLE IF NOT EXISTS \"display_media\" (\n  \"id\" UUID PRIMARY KEY,\n  \"store_id\" UUID NOT NULL REFERENCES \"store\"(\"id\"),\n  \"kind\" VARCHAR(10) NOT NULL,\n  \"name\" VARCHAR(200) NOT NULL,\n  \"mime\" VARCHAR(60) NOT NULL,\n  \"size_bytes\" BIGINT NOT NULL,\n  \"duration_s\" INTEGER,\n  \"sha256\" CHAR(64) NOT NULL,\n  \"days\" SMALLINT[] NOT NULL DEFAULT '{}',\n  \"time_from\" TIME,\n  \"time_to\" TIME,\n  \"active\" BOOLEAN NOT NULL DEFAULT TRUE,\n  \"sort_order\" INTEGER NOT NULL DEFAULT 0,\n  \"created_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"created_by\" VARCHAR(80),\n  \"deleted_at\" TIMESTAMPTZ(3),\n  CONSTRAINT \"ck_display_media_kind\" CHECK (\"kind\" IN ('video','image')),\n  CONSTRAINT \"ck_display_media_mime\" CHECK (\"mime\" ~ '^(video|image)/[a-z0-9.+-]+$'),\n  CONSTRAINT \"ck_display_media_size\" CHECK (\"size_bytes\" > 0 AND \"size_bytes\" <= 314572800),\n  CONSTRAINT \"ck_display_media_duration\" CHECK (\"duration_s\" IS NULL OR \"duration_s\" >= 0),\n  CONSTRAINT \"ck_display_media_sha\" CHECK (\"sha256\" ~ '^[0-9a-f]{64}$'),\n  CONSTRAINT \"ck_display_media_days\" CHECK (\"days\" <@ ARRAY[1,2,3,4,5,6,7]::SMALLINT[])\n);\nCREATE INDEX IF NOT EXISTS \"ix_display_media_store_id\" ON \"display_media\" (\"store_id\");\nCREATE INDEX IF NOT EXISTS \"ix_display_media_live\" ON \"display_media\" (\"store_id\", \"sort_order\") WHERE \"deleted_at\" IS NULL;\nCOMMENT ON TABLE \"display_media\" IS 'Vídeos e imágenes de la segunda pantalla; el archivo está en MEDIA_DIR/<id> del servidor de la tienda';\nCOMMENT ON COLUMN \"display_media\".\"days\" IS 'Días en que sale: 1 = lunes … 7 = domingo; vacío = todos';\nCOMMENT ON COLUMN \"display_media\".\"time_from\" IS 'Desde (hora de Madrid); con time_to menor, cruza la medianoche; vacío = todo el día';\n\n\n-- 0022 · Origen al juntar mesas o pasar una cuenta a una mesa ocupada (27/10/2026, 1.2.203).\n-- account.origin: la cuenta llegó de otra mesa como cuenta nueva: {\"table\":\"1\",\"by\":\"Sistemas\",\"at\":\"2026-10-27T22:30:00.000Z\"}.\n-- order_line.origin: la línea se unió a la cuenta principal de la mesa de destino: {\"table\":\"1\"}. Vacío = es de esta mesa.\nALTER TABLE \"account\" ADD COLUMN IF NOT EXISTS \"origin\" JSONB;\nALTER TABLE \"order_line\" ADD COLUMN IF NOT EXISTS \"origin\" JSONB;\nDO $$ BEGIN ALTER TABLE \"account\" ADD CONSTRAINT \"ck_account_origin\" CHECK (\"origin\" IS NULL OR jsonb_typeof(\"origin\") = 'object'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;\nDO $$ BEGIN ALTER TABLE \"order_line\" ADD CONSTRAINT \"ck_order_line_origin\" CHECK (\"origin\" IS NULL OR jsonb_typeof(\"origin\") = 'object'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;\nCOMMENT ON COLUMN \"account\".\"origin\" IS 'Mesa de la que vino la cuenta al juntar o transferir a una mesa ocupada: table, by (quién), at';\nCOMMENT ON COLUMN \"order_line\".\"origin\" IS 'Mesa de la que vino la línea al unirse a la cuenta principal de otra mesa: table';\n\n\n-- 0023 · Ajustes › Administración › Sistema (TPV 1.2.206, 02/11/2026).\n-- system_branding: una fila por tienda con el nombre del sistema (acceso, menú lateral y pestaña del navegador),\n-- el subtítulo, el texto del grupo en la pantalla de acceso, el logo del sistema, el icono «Sin imagen»,\n-- la paleta de colores que cada equipo puede elegir y los colores del sistema. La ven todos los equipos.\n-- Sin fila = los valores originales (Japp, paleta Verde #15616D). Se edita con el permiso ajustes.restaurante.\n-- Las imágenes van como data URL (PNG reescalado a 256 px o SVG): como mucho 190 000 caracteres, igual que en el TPV.\nCREATE TABLE IF NOT EXISTS \"system_branding\" (\n  \"store_id\"    UUID PRIMARY KEY REFERENCES \"store\" (\"id\"),\n  \"name\"        VARCHAR(60) NOT NULL DEFAULT 'Japp',\n  \"subtitle\"    VARCHAR(60),\n  \"login_group\" VARCHAR(80),\n  \"logo\"        TEXT,\n  \"no_image\"    TEXT,\n  \"palette\"     JSONB NOT NULL DEFAULT '[{\"hex\":\"#15616D\",\"name\":\"Verde\",\"default\":true}]'::jsonb,\n  \"colors\"      JSONB NOT NULL DEFAULT '{}'::jsonb,\n  \"version\"     INTEGER NOT NULL DEFAULT 1 CHECK (\"version\" > 0),\n  \"updated_at\"  TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_by\"  VARCHAR(80),\n  CONSTRAINT \"ck_system_branding_name\" CHECK (length(btrim(\"name\")) > 0),\n  CONSTRAINT \"ck_system_branding_logo\" CHECK (\"logo\" IS NULL OR (\"logo\" LIKE 'data:image/%' AND length(\"logo\") <= 190000)),\n  CONSTRAINT \"ck_system_branding_no_image\" CHECK (\"no_image\" IS NULL OR (\"no_image\" LIKE 'data:image/%' AND length(\"no_image\") <= 190000)),\n  CONSTRAINT \"ck_system_branding_palette\" CHECK (jsonb_typeof(\"palette\") = 'array' AND jsonb_array_length(\"palette\") BETWEEN 1 AND 12),\n  CONSTRAINT \"ck_system_branding_colors\" CHECK (jsonb_typeof(\"colors\") = 'object')\n);\nDROP TRIGGER IF EXISTS \"trg_system_branding_updated_at\" ON \"system_branding\";\nCREATE TRIGGER \"trg_system_branding_updated_at\" BEFORE UPDATE ON \"system_branding\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"system_branding\" IS 'Ajustes › Administración › Sistema: nombre, textos del acceso, logos y colores del sistema (una fila por tienda; sin fila = los originales)';\nCOMMENT ON COLUMN \"system_branding\".\"name\" IS 'Nombre del sistema: acceso, menú lateral y pestaña del navegador («TPV <name>»)';\nCOMMENT ON COLUMN \"system_branding\".\"login_group\" IS 'Texto del grupo en la pantalla de acceso; vacío = no se enseña';\nCOMMENT ON COLUMN \"system_branding\".\"logo\" IS 'Logo del sistema como data URL (PNG ≤ 256 px o SVG); vacío = el original';\nCOMMENT ON COLUMN \"system_branding\".\"no_image\" IS 'Icono «Sin imagen» (productos sin foto) como data URL; vacío = el original';\nCOMMENT ON COLUMN \"system_branding\".\"palette\" IS 'Colores que se pueden elegir en cada equipo: [{hex:\"#RRGGBB\", name, default:true en uno solo}]';\nCOMMENT ON COLUMN \"system_branding\".\"colors\" IS 'Colores del sistema: secondary, bg, card, text, muted, line, link, ok, warn, err, info (#RRGGBB); el que falta = el original';\n\n\n-- 0024 · Gestiones › Resumen semana (TPV 1.2.262–1.2.263, 02/11/2026).\n-- La semana se calcula con los cierres de periodo (period_summary) y los objetivos (sales_target): GET /reports/week.\n-- week_note: la observación de cada día de la hoja (una por tienda y día de negocio), con versión para no pisar a otro equipo.\n-- period_summary.by_product: lo vendido por producto en el periodo, para «productos más vendidos con su % de mezcla».\nCREATE TABLE IF NOT EXISTS \"week_note\" (\n  \"id\"            UUID PRIMARY KEY,\n  \"store_id\"      UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"business_date\" DATE NOT NULL,\n  \"note\"          VARCHAR(500) NOT NULL,\n  \"version\"       INTEGER NOT NULL DEFAULT 1 CHECK (\"version\" > 0),\n  \"created_at\"    TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_at\"    TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_by\"    VARCHAR(80),\n  CONSTRAINT \"ck_week_note_note\" CHECK (length(btrim(\"note\")) > 0),\n  CONSTRAINT \"uq_week_note_store_id_business_date\" UNIQUE (\"store_id\", \"business_date\")\n);\nDROP TRIGGER IF EXISTS \"trg_week_note_updated_at\" ON \"week_note\";\nCREATE TRIGGER \"trg_week_note_updated_at\" BEFORE UPDATE ON \"week_note\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"week_note\" IS 'Observaciones de cada día en Gestiones › Resumen semana (una por tienda y día de negocio; borrar el texto borra la fila)';\nCOMMENT ON COLUMN \"week_note\".\"business_date\" IS 'Día de negocio (el del periodo), no el día natural';\n\nALTER TABLE \"period_summary\" ADD COLUMN IF NOT EXISTS \"by_product\" JSONB NOT NULL DEFAULT '[]'::jsonb;\nDO $$ BEGIN ALTER TABLE \"period_summary\" ADD CONSTRAINT \"ck_period_summary_by_product\" CHECK (jsonb_typeof(\"by_product\") = 'array'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;\nCOMMENT ON COLUMN \"period_summary\".\"by_product\" IS 'Vendido por producto en el periodo: [{plu, name, quantity, amount}] (sin anulaciones ni invitaciones); se rellena al cerrar';\n\n\n-- 0025 · Delivery: Ajustes › Pedidos y tablero de Pedidos (TPV 1.2.217–1.2.233 y 1.2.264, 02/11/2026).\n-- Hasta ahora el TPV lo guardaba solo en el equipo (st.cfg.pedidos y st.delivery). Con esto pasa al servidor de la tienda.\n--   delivery_settings      una fila por tienda: delivery en este local, integración, plataformas, tiempos y funcionamiento\n--   delivery_rider         motorizados de la tienda (además siempre está «Repartidor de la plataforma», que no es una fila)\n--   delivery_order         cada pedido: plataforma, código, cliente, dirección, pago, estado, motorizado y total\n--   delivery_order_line    los productos del pedido tal como llegan\n--   delivery_order_event   cada cambio de estado con hora y quién (la ficha del pedido enseña los pasos)\n-- Estados (en este orden): pending → received → to_assign → assigned → on_route → delivered; cancelled desde cualquiera sin terminar.\n-- En el TPV: pend, rec, poras, asig, camino, done, cancel.\n\nCREATE TABLE IF NOT EXISTS \"delivery_settings\" (\n  \"store_id\"        UUID PRIMARY KEY REFERENCES \"store\" (\"id\"),\n  \"active\"          BOOLEAN NOT NULL DEFAULT TRUE,\n  \"integration\"     BOOLEAN NOT NULL DEFAULT TRUE,\n  \"provider\"        VARCHAR(40) DEFAULT 'Deliverect',\n  \"platforms\"       JSONB NOT NULL DEFAULT '[{\"id\":\"glovo\",\"name\":\"Glovo\",\"active\":true},{\"id\":\"uber\",\"name\":\"Uber Eats\",\"active\":true},{\"id\":\"just\",\"name\":\"Just Eat\",\"active\":true},{\"id\":\"own\",\"name\":\"Web propia\",\"active\":true}]'::jsonb,\n  \"auto_accept\"     BOOLEAN NOT NULL DEFAULT FALSE,\n  \"ask_rider\"       BOOLEAN NOT NULL DEFAULT TRUE,\n  \"sound\"           BOOLEAN NOT NULL DEFAULT TRUE,\n  \"prep_minutes\"    SMALLINT NOT NULL DEFAULT 15,\n  \"amber_minutes\"   SMALLINT NOT NULL DEFAULT 15,\n  \"red_minutes\"     SMALLINT NOT NULL DEFAULT 30,\n  \"version\"         INTEGER NOT NULL DEFAULT 1 CHECK (\"version\" > 0),\n  \"updated_at\"      TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_by\"      VARCHAR(80),\n  CONSTRAINT \"ck_delivery_settings_minutes\" CHECK (\"prep_minutes\" BETWEEN 1 AND 240 AND \"amber_minutes\" BETWEEN 1 AND 240 AND \"red_minutes\" BETWEEN 1 AND 240),\n  CONSTRAINT \"ck_delivery_settings_light\" CHECK (\"red_minutes\" > \"amber_minutes\"),\n  CONSTRAINT \"ck_delivery_settings_platforms\" CHECK (jsonb_typeof(\"platforms\") = 'array')\n);\nDROP TRIGGER IF EXISTS \"trg_delivery_settings_updated_at\" ON \"delivery_settings\";\nCREATE TRIGGER \"trg_delivery_settings_updated_at\" BEFORE UPDATE ON \"delivery_settings\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"delivery_settings\" IS 'Ajustes › Pedidos › Delivery (una fila por tienda; sin fila = los valores por defecto)';\nCOMMENT ON COLUMN \"delivery_settings\".\"active\" IS 'Delivery en este local: apagado, el botón Pedidos no sale (ni en mesas ni en fast food) y la API no acepta pedidos nuevos';\nCOMMENT ON COLUMN \"delivery_settings\".\"integration\" IS 'Recibir pedidos de las plataformas a través del integrador';\nCOMMENT ON COLUMN \"delivery_settings\".\"platforms\" IS '[{id: glovo|uber|just|own|…, name, active}]';\nCOMMENT ON COLUMN \"delivery_settings\".\"auto_accept\" IS 'Los pedidos nuevos pasan solos de pending a received';\nCOMMENT ON COLUMN \"delivery_settings\".\"ask_rider\" IS 'Al pasar a assigned hay que elegir quién lo lleva (motorizado o «Repartidor de la plataforma»)';\nCOMMENT ON COLUMN \"delivery_settings\".\"prep_minutes\" IS 'Tiempo de preparación que se avisa a la plataforma al aceptar';\nCOMMENT ON COLUMN \"delivery_settings\".\"amber_minutes\" IS 'Semáforo en ámbar desde estos minutos desde que llegó el pedido';\nCOMMENT ON COLUMN \"delivery_settings\".\"red_minutes\" IS 'Semáforo en rojo (y aviso en el botón Pedidos) desde estos minutos; mayor que amber_minutes';\n\nCREATE TABLE IF NOT EXISTS \"delivery_rider\" (\n  \"id\"          UUID PRIMARY KEY,\n  \"store_id\"    UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"name\"        VARCHAR(40) NOT NULL,\n  \"phone\"       VARCHAR(20),\n  \"active\"      BOOLEAN NOT NULL DEFAULT TRUE,\n  \"sort_order\"  SMALLINT NOT NULL DEFAULT 0,\n  \"version\"     INTEGER NOT NULL DEFAULT 1 CHECK (\"version\" > 0),\n  \"created_at\"  TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_at\"  TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  CONSTRAINT \"ck_delivery_rider_name\" CHECK (length(btrim(\"name\")) > 0)\n);\nCREATE INDEX IF NOT EXISTS \"ix_delivery_rider_store_id\" ON \"delivery_rider\" (\"store_id\");\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_delivery_rider_store_id_name_active\" ON \"delivery_rider\" (\"store_id\", lower(btrim(\"name\"))) WHERE \"active\";\nDROP TRIGGER IF EXISTS \"trg_delivery_rider_updated_at\" ON \"delivery_rider\";\nCREATE TRIGGER \"trg_delivery_rider_updated_at\" BEFORE UPDATE ON \"delivery_rider\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"delivery_rider\" IS 'Motorizados de la tienda (Ajustes › Pedidos › Motorizados). Quitar uno lo desactiva: los pedidos antiguos lo siguen nombrando';\n\nCREATE TABLE IF NOT EXISTS \"delivery_order\" (\n  \"id\"             UUID PRIMARY KEY,\n  \"store_id\"       UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"period_id\"      UUID REFERENCES \"sales_period\" (\"id\"),\n  \"platform\"       VARCHAR(20) NOT NULL,\n  \"code\"           VARCHAR(30) NOT NULL,\n  \"external_id\"    VARCHAR(80),\n  \"customer_name\"  VARCHAR(80) NOT NULL,\n  \"customer_phone\" VARCHAR(20),\n  \"address\"        VARCHAR(200),\n  \"payment_note\"   VARCHAR(80),\n  \"note\"           VARCHAR(300),\n  \"status\"         VARCHAR(12) NOT NULL DEFAULT 'pending',\n  \"rider_id\"       UUID REFERENCES \"delivery_rider\" (\"id\"),\n  \"rider_name\"     VARCHAR(60),\n  \"total\"          NUMERIC(10,2) NOT NULL DEFAULT 0,\n  \"received_at\"    TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"finished_at\"    TIMESTAMPTZ(3),\n  \"order_id\"       UUID REFERENCES \"orders\" (\"id\"),\n  \"version\"        INTEGER NOT NULL DEFAULT 1 CHECK (\"version\" > 0),\n  \"created_at\"     TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"updated_at\"     TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  CONSTRAINT \"ck_delivery_order_status\" CHECK (\"status\" IN ('pending','received','to_assign','assigned','on_route','delivered','cancelled')),\n  CONSTRAINT \"ck_delivery_order_platform\" CHECK (\"platform\" ~ '^[a-z0-9_-]{2,20}$'),\n  CONSTRAINT \"ck_delivery_order_total\" CHECK (\"total\" >= 0),\n  CONSTRAINT \"ck_delivery_order_finished\" CHECK ((\"status\" IN ('delivered','cancelled')) = (\"finished_at\" IS NOT NULL)),\n  CONSTRAINT \"ck_delivery_order_rider\" CHECK (\"status\" NOT IN ('assigned','on_route','delivered') OR \"rider_name\" IS NOT NULL)\n);\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_store_id\" ON \"delivery_order\" (\"store_id\");\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_period_id\" ON \"delivery_order\" (\"period_id\");\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_rider_id\" ON \"delivery_order\" (\"rider_id\");\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_order_id\" ON \"delivery_order\" (\"order_id\");\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_live\" ON \"delivery_order\" (\"store_id\", \"received_at\") WHERE \"finished_at\" IS NULL;\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_delivery_order_external\" ON \"delivery_order\" (\"store_id\", \"platform\", \"external_id\") WHERE \"external_id\" IS NOT NULL;\nDROP TRIGGER IF EXISTS \"trg_delivery_order_updated_at\" ON \"delivery_order\";\nCREATE TRIGGER \"trg_delivery_order_updated_at\" BEFORE UPDATE ON \"delivery_order\" FOR EACH ROW EXECUTE FUNCTION set_updated_at();\nCOMMENT ON TABLE \"delivery_order\" IS 'Pedidos de delivery del tablero Pedidos (Glovo, Uber Eats, Just Eat, web propia…)';\nCOMMENT ON COLUMN \"delivery_order\".\"code\" IS 'Transacción que se enseña en el tablero (GLV-4821)';\nCOMMENT ON COLUMN \"delivery_order\".\"external_id\" IS 'Id del pedido en la plataforma o el integrador: el mismo pedido no entra dos veces';\nCOMMENT ON COLUMN \"delivery_order\".\"payment_note\" IS 'Cómo se paga, tal como llega («Pagado online», «Paga en la entrega · tarjeta»)';\nCOMMENT ON COLUMN \"delivery_order\".\"rider_name\" IS 'Quién lo lleva: el nombre del motorizado al asignarlo o «Repartidor de la plataforma» (sin rider_id)';\nCOMMENT ON COLUMN \"delivery_order\".\"received_at\" IS 'Cuándo llegó: de aquí salen la espera y el semáforo';\nCOMMENT ON COLUMN \"delivery_order\".\"order_id\" IS 'Transacción del TPV si el pedido se factura en la tienda (vacío mientras no)';\n\nCREATE TABLE IF NOT EXISTS \"delivery_order_line\" (\n  \"id\"                UUID PRIMARY KEY,\n  \"store_id\"          UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"delivery_order_id\" UUID NOT NULL REFERENCES \"delivery_order\" (\"id\") ON DELETE CASCADE,\n  \"line_no\"           SMALLINT NOT NULL,\n  \"product_id\"        UUID REFERENCES \"product\" (\"id\"),\n  \"name\"              VARCHAR(120) NOT NULL,\n  \"quantity\"          NUMERIC(10,3) NOT NULL,\n  \"unit_price\"        NUMERIC(10,2) NOT NULL,\n  \"note\"              VARCHAR(200),\n  CONSTRAINT \"ck_delivery_order_line_quantity\" CHECK (\"quantity\" > 0),\n  CONSTRAINT \"ck_delivery_order_line_unit_price\" CHECK (\"unit_price\" >= 0),\n  CONSTRAINT \"uq_delivery_order_line_order_line_no\" UNIQUE (\"delivery_order_id\", \"line_no\")\n);\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_line_store_id\" ON \"delivery_order_line\" (\"store_id\");\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_line_product_id\" ON \"delivery_order_line\" (\"product_id\");\nCOMMENT ON TABLE \"delivery_order_line\" IS 'Productos de un pedido de delivery tal como llegan (product_id si se reconoce el PLU de la carta)';\n\nCREATE TABLE IF NOT EXISTS \"delivery_order_event\" (\n  \"id\"                UUID PRIMARY KEY,\n  \"store_id\"          UUID NOT NULL REFERENCES \"store\" (\"id\"),\n  \"delivery_order_id\" UUID NOT NULL REFERENCES \"delivery_order\" (\"id\") ON DELETE CASCADE,\n  \"status\"            VARCHAR(12) NOT NULL,\n  \"at\"                TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  \"user_id\"           UUID REFERENCES \"app_user\" (\"id\"),\n  \"by_name\"           VARCHAR(80),\n  \"note\"              VARCHAR(300),\n  CONSTRAINT \"ck_delivery_order_event_status\" CHECK (\"status\" IN ('pending','received','to_assign','assigned','on_route','delivered','cancelled'))\n);\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_event_store_id\" ON \"delivery_order_event\" (\"store_id\");\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_event_delivery_order_id\" ON \"delivery_order_event\" (\"delivery_order_id\", \"at\");\nCREATE INDEX IF NOT EXISTS \"ix_delivery_order_event_user_id\" ON \"delivery_order_event\" (\"user_id\");\nCOMMENT ON TABLE \"delivery_order_event\" IS 'Pasos de cada pedido: estado, cuándo y quién (by_name = «Integración» o «Automático» si no lo hizo una persona)';\n\n-- Permisos nuevos: Ajustes › Pedidos y el tablero. Ajustes › Pedidos a quien ya tenía Restaurante; el tablero, a todos los perfiles.\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\") VALUES\n  ('ajustes.pedidos', 'Ajustes', 'Pedidos · Delivery', 48),\n  ('funciones.pedidos', 'Funciones', 'Tablero de pedidos (delivery)', 49)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT \"profile_id\", 'ajustes.pedidos', \"store_id\" FROM \"profile_permission\" WHERE \"permission_code\" = 'ajustes.restaurante'\nON CONFLICT DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT \"id\", 'funciones.pedidos', \"store_id\" FROM \"user_profile\"\nON CONFLICT DO NOTHING;\n\n\n-- 0026 · Pruebas del 28/10 de Catalina (TPV 1.2.260, 02/11/2026).\n-- 1. No hay dos personas con el mismo nombre aunque cambien mayúsculas o espacios («Ana» y « ana »).\n--    Si una tienda ya tiene dos así, el índice no se crea (la migración no falla) y se avisa: hay que renombrar una y\n--    volver a lanzar este bloque a mano. La API lo comprueba igualmente (409 DUPLICATE, field name).\n-- 2. Los clientes del fichero se buscan también por correo: índice para la búsqueda.\nDO $$\nBEGIN\n  IF EXISTS (SELECT 1 FROM \"app_user\" GROUP BY \"store_id\", lower(btrim(\"name\")) HAVING count(*) > 1) THEN\n    RAISE NOTICE '0026: hay personas con el mismo nombre (sin contar mayúsculas ni espacios); no se crea uq_app_user_store_id_name_ci';\n  ELSE\n    CREATE UNIQUE INDEX IF NOT EXISTS \"uq_app_user_store_id_name_ci\" ON \"app_user\" (\"store_id\", lower(btrim(\"name\")));\n  END IF;\nEND $$;\nCREATE INDEX IF NOT EXISTS \"ix_customer_ref_store_id_email\" ON \"customer_ref\" (\"store_id\", lower(\"email\")) WHERE \"email\" IS NOT NULL;\n\n\n-- 0027 · Propina en el ticket de la factura (04/11/2026, API 1.2.268).\n-- La propina nunca forma parte de la factura (ni del total, ni del IVA, ni del registro VeriFactu): es un dato interno\n-- del cobro (payment.tip). Este parámetro solo decide si se imprime en el ticket de la factura. Por defecto, sí.\nALTER TABLE \"store_parameters\" ADD COLUMN IF NOT EXISTS \"print_tip\" BOOLEAN NOT NULL DEFAULT true;\nCOMMENT ON COLUMN \"store_parameters\".\"print_tip\" IS 'Imprimir la propina en el ticket de la factura (no es dato fiscal)';\n\n-- Bloqueo por inactividad: desde las pruebas del 28/10 es 0 (nunca) o de 10 a 3600 s. Los datos de arranque traían 7 s y\n-- con eso la API rechazaba cualquier cambio de Ajustes › Parámetros («El bloqueo es 0 (nunca) o de 10 a 3600 segundos»).\nUPDATE \"store_parameters\" SET \"lock_seconds\" = 10 WHERE \"lock_seconds\" BETWEEN 1 AND 9;\nUPDATE \"store_parameters\" SET \"lock_seconds_pda\" = 10 WHERE \"lock_seconds_pda\" BETWEEN 1 AND 9;\nALTER TABLE \"store_parameters\" ALTER COLUMN \"lock_seconds\" SET DEFAULT 10;\n\n\n-- 0028 · Reconexiones de la orden (decidido con el dueño el 04/11/2026, API 1.2.268).\n-- Lo que un equipo ticó sin conexión con el servidor (se le fue el wifi o se cayó el servidor) nunca entra directo en la\n-- cuenta: al volver la conexión se guarda aquí, pendiente. Quien tenga «Resolver reconexiones» (o con la clave de un\n-- encargado) lo valida —pasa a la orden y sale la comanda— o lo descarta con un motivo. Mientras haya algo pendiente,\n-- esa cuenta no se cobra. Nada se borra: queda quién lo marcó, en qué equipo, cuándo y quién decidió.\nCREATE TABLE IF NOT EXISTS \"order_reconnection\" (\n  \"id\" UUID PRIMARY KEY,\n  \"store_id\" UUID NOT NULL REFERENCES \"store\" (\"id\") ON DELETE CASCADE,\n  \"order_id\" UUID NOT NULL REFERENCES \"orders\" (\"id\") ON DELETE CASCADE,\n  \"account_id\" UUID REFERENCES \"account\" (\"id\") ON DELETE SET NULL,\n  \"client_id\" VARCHAR(80) NOT NULL,\n  \"plu\" INTEGER NOT NULL,\n  \"name\" VARCHAR(120) NOT NULL,\n  \"quantity\" INTEGER NOT NULL CHECK (\"quantity\" > 0),\n  \"unit_price\" NUMERIC(10, 2) NOT NULL DEFAULT 0,\n  \"detail\" JSONB NOT NULL DEFAULT '{}'::jsonb,\n  \"marked_at\" TIMESTAMPTZ(3) NOT NULL,\n  \"marked_by_id\" UUID,\n  \"marked_by_name\" VARCHAR(60),\n  \"device\" VARCHAR(40),\n  \"offline_reason\" VARCHAR(80),\n  \"status\" VARCHAR(12) NOT NULL DEFAULT 'pending' CHECK (\"status\" IN ('pending', 'accepted', 'discarded')),\n  \"decided_at\" TIMESTAMPTZ(3),\n  \"decided_by_name\" VARCHAR(60),\n  \"authorized_by_name\" VARCHAR(60),\n  \"decision_reason\" VARCHAR(200),\n  \"created_at\" TIMESTAMPTZ(3) NOT NULL DEFAULT now(),\n  CONSTRAINT \"uq_order_reconnection_client\" UNIQUE (\"store_id\", \"client_id\")\n);\nCREATE INDEX IF NOT EXISTS \"ix_order_reconnection_store_status\" ON \"order_reconnection\" (\"store_id\", \"status\");\nCREATE INDEX IF NOT EXISTS \"ix_order_reconnection_order\" ON \"order_reconnection\" (\"order_id\");\nCREATE INDEX IF NOT EXISTS \"ix_order_reconnection_account\" ON \"order_reconnection\" (\"account_id\");\nCOMMENT ON TABLE \"order_reconnection\" IS 'Lo ticado sin conexión, pendiente de validar o descartar (Reconexiones de la orden)';\nCOMMENT ON COLUMN \"order_reconnection\".\"client_id\" IS 'Id que puso el equipo al marcarlo: un reintento no lo duplica';\nCOMMENT ON COLUMN \"order_reconnection\".\"detail\" IS 'Respuestas, comentario y pases tal como se marcaron';\nCOMMENT ON COLUMN \"order_reconnection\".\"offline_reason\" IS 'Motivo de la desconexión que vio el equipo (sin red, servidor sin respuesta)';\n\n-- Permiso nuevo, configurable en Ajustes › Accesos: a quien ya puede autorizar (encargados)\nINSERT INTO \"permission\" (\"code\", \"module\", \"name\", \"sort_order\") VALUES\n  ('pedido.reconexiones', 'Pedido', 'Resolver reconexiones', 17)\nON CONFLICT (\"code\") DO NOTHING;\nINSERT INTO \"profile_permission\" (\"profile_id\", \"permission_code\", \"store_id\")\n  SELECT \"profile_id\", 'pedido.reconexiones', \"store_id\" FROM \"profile_permission\" WHERE \"permission_code\" = 'sistema.autorizar'\nON CONFLICT DO NOTHING;\n\n\n-- 0029 · Formatos de ticket en el servidor (N1, decidido el 04/11/2026, API 1.2.268).\n-- Ajustes › Formatos de ticket (precuenta y factura) se guarda aquí y la API lo aplica al imprimir: logo, cadena, local,\n-- razón social, NIF, dirección, teléfono, camarero, desglose de IVA, por persona, pie, despedida (con su texto), QR de\n-- reseñas (con su texto), QR tributario, abrir el cajón y propina. Vacío = todo sale (los valores por defecto del TPV).\n-- En la factura el nombre fiscal y el NIF salen siempre (obligatorios), lo diga o no el formato.\nALTER TABLE \"store_parameters\" ADD COLUMN IF NOT EXISTS \"ticket_formats\" JSONB NOT NULL DEFAULT '{}'::jsonb;\nCOMMENT ON COLUMN \"store_parameters\".\"ticket_formats\" IS 'Formatos de precuenta y factura de Ajustes › Formatos de ticket: {prebill:{…}, invoice:{…}}; lo que falta, sale';\n\n\n-- 0030 · Cierre de la versión de facturación (decidido con el dueño el 04/11/2026, API 1.2.268).\n\n-- 16 · El tablero de pedidos de delivery solo para cajero y encargado: se queda en los perfiles que abren o cierran el\n-- periodo o cobran (cajero) o autorizan (encargado); al resto se le quita. Se puede volver a dar en Ajustes › Accesos.\nDELETE FROM \"profile_permission\" pp\n WHERE pp.\"permission_code\" = 'funciones.pedidos'\n   AND NOT EXISTS (SELECT 1 FROM \"profile_permission\" x WHERE x.\"profile_id\" = pp.\"profile_id\"\n                    AND x.\"permission_code\" IN ('cobro.cobrar', 'funciones.periodo', 'sistema.autorizar'));\n\n-- 10 · Factura por email: no se envían correos. La factura lleva su estado de envío, que se queda en «no enviada».\nALTER TABLE \"invoice\" ADD COLUMN IF NOT EXISTS \"email_status\" VARCHAR(12) NOT NULL DEFAULT 'not_sent';\nALTER TABLE \"invoice\" DROP CONSTRAINT IF EXISTS \"invoice_email_status_check\";\nALTER TABLE \"invoice\" ADD CONSTRAINT \"invoice_email_status_check\" CHECK (\"email_status\" IN ('not_sent', 'sent', 'failed'));\nCOMMENT ON COLUMN \"invoice\".\"email_status\" IS 'Envío por email: not_sent (no se envían correos, 04/11/2026), sent o failed';\n\n-- F3 · Límite de la factura simplificada, configurable por tienda (0 = sin límite). Por encima, factura completa.\nALTER TABLE \"billing_settings\" ADD COLUMN IF NOT EXISTS \"simplified_limit\" NUMERIC(10,2) NOT NULL DEFAULT 3000;\nALTER TABLE \"billing_settings\" DROP CONSTRAINT IF EXISTS \"billing_settings_simplified_limit_check\";\nALTER TABLE \"billing_settings\" ADD CONSTRAINT \"billing_settings_simplified_limit_check\" CHECK (\"simplified_limit\" >= 0);\nCOMMENT ON COLUMN \"billing_settings\".\"simplified_limit\" IS 'Importe máximo (IVA incl.) de una factura simplificada; 0 = sin límite (hostelería: 3.000 €)';\n\n-- F1 · Factura completa que sustituye a una simplificada (tipo F3): la simplificada no se toca, queda «substituted» y\n-- la nueva apunta a ella. No se mueve dinero.\nALTER TABLE \"invoice\" ADD COLUMN IF NOT EXISTS \"substituted_invoice_id\" UUID REFERENCES \"invoice\" (\"id\");\nCREATE INDEX IF NOT EXISTS \"ix_invoice_substituted_invoice_id\" ON \"invoice\" (\"substituted_invoice_id\");\nCOMMENT ON COLUMN \"invoice\".\"substituted_invoice_id\" IS 'F3: factura simplificada a la que sustituye';\nALTER TABLE \"invoice\" DROP CONSTRAINT IF EXISTS \"invoice_status_check\";\nALTER TABLE \"invoice\" ADD CONSTRAINT \"invoice_status_check\" CHECK (\"status\" IN ('issued', 'rectified', 'cancelled', 'substituted'));\nDROP INDEX IF EXISTS \"uq_invoice_account_issued\";\nCREATE UNIQUE INDEX IF NOT EXISTS \"uq_invoice_account_issued\" ON \"invoice\" (\"account_id\")\n  WHERE \"type\" IN ('F1', 'F2', 'F3') AND \"status\" = 'issued' AND \"account_id\" IS NOT NULL;\n\n-- N7 · Tipo de cuenta: normal u order_on_table (los pedidos del cliente por el QR van a su propia cuenta).\nALTER TABLE \"account\" ADD COLUMN IF NOT EXISTS \"kind\" VARCHAR(20) NOT NULL DEFAULT 'normal';\nALTER TABLE \"account\" DROP CONSTRAINT IF EXISTS \"account_kind_check\";\nALTER TABLE \"account\" ADD CONSTRAINT \"account_kind_check\" CHECK (\"kind\" IN ('normal', 'order_on_table'));\nUPDATE \"account\" SET \"kind\" = 'order_on_table' WHERE \"name\" LIKE 'Order on Table%' AND \"kind\" = 'normal';\nCOMMENT ON COLUMN \"account\".\"kind\" IS 'normal u order_on_table (pedidos del cliente por el QR)';\n\n-- N3 · Propina con todas las formas de pago (menos las de tipo descuento). Sigue fuera de la factura y de VeriFactu.\nUPDATE \"payment_method\" SET \"allows_tip\" = TRUE WHERE \"kind\" <> 'discount' AND \"allows_tip\" = FALSE;\nALTER TABLE \"payment_method\" ALTER COLUMN \"allows_tip\" SET DEFAULT TRUE;\n\n-- 11 · Corte Z con el motivo del descuadre: se guarda la nota del cierre.\nALTER TABLE \"cash_closing\" ADD COLUMN IF NOT EXISTS \"note\" VARCHAR(300);\nCOMMENT ON COLUMN \"cash_closing\".\"note\" IS 'Motivo del descuadre escrito al cerrar (sale en el corte Z)';\n\n\n-- 0031 · El logo configurado sale en el papel (pruebas en JC01, 04/11/2026).\n-- La impresora imprimía siempre el logo de la cadena (CyT) aunque el local tuviera el suyo en Ajustes › Restaurante.\n-- El TPV prepara el logo para la impresora (orden ESC/POS «GS v 0», blanco y negro) y lo guarda aquí; la API lo imprime en\n-- precuenta, factura y abo
