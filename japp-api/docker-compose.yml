# Tienda completa en local: PostgreSQL 16 + API (que también sirve el TPV). Ejecutar desde japp-api:  docker compose up --build -d
# TPV: http://localhost:8080/   ·   Swagger: http://localhost:8080/api/v2/docs/
# La primera vez crea el esquema y carga la Sucursal Pruebas (SEED=1). En una tienda real, SEED=0.
services:
  db:
    image: postgres:16.4
    environment: { POSTGRES_USER: japp, POSTGRES_PASSWORD: "${DB_PASSWORD:-japp_local}", POSTGRES_DB: japp, TZ: UTC }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]   # solo desde este Mac (TablePlus, psql). 5433 para no chocar con un PostgreSQL de Homebrew
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U japp"], interval: 2s, retries: 30 }
  api:
    build: { context: .., dockerfile: japp-api/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: "postgres://japp:${DB_PASSWORD:-japp_local}@db:5432/japp"
      SESSION_SECRET: "${SESSION_SECRET:?Pon SESSION_SECRET en .env (32+ caracteres aleatorios)}"
      STORE_CODE: "${STORE_CODE:-CT 03}"
      SEED: "${SEED:-1}"
      PRINTER_MODE: "${PRINTER_MODE:-log}"
      API_MODE: "${API_MODE:-developer}"   # va en el campo mode de cada respuesta
      CORS_ORIGINS: "${CORS_ORIGINS:-}"   # vacío = solo mismo origen. Ver .env.example
      OOT_INTEGRATION_KEY: "${OOT_INTEGRATION_KEY:-}"   # Order on Table; vacía = /api/v2/oot/* cerrado
      PORT: 8080
    ports: ["8080:8080"]               # abierto a la red local: TPV y PDA entran por http://<IP del Mac>:8080
    restart: unless-stopped
  # Envía las transacciones (abiertas y cerradas) a Japp Manager. Arranca con: docker compose --profile sync up -d
  sync-agent:
    profiles: [sync]
    build: { context: .., dockerfile: japp-api/Dockerfile }
    depends_on: { api: { condition: service_healthy } }
    working_dir: /app/japp-api/apps/sync-agent
    command: ["npx", "tsx", "src/Program.ts"]
    environment:
      DATABASE_URL: "postgres://japp:${DB_PASSWORD:-japp_local}@db:5432/japp"
      STORE_CODE: "${STORE_CODE:-CT 03}"
      MANAGER_URL: "${MANAGER_URL:?Pon MANAGER_URL en .env}"
      STORE_KEY: "${STORE_KEY:?Pon STORE_KEY en .env}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-60}"
      SYNC_INSTANT: "${SYNC_INSTANT:-true}"
    restart: unless-stopped
volumes:
  pgdata:
